name: Android screenshots

# Renders the app's main screens on the JVM (Robolectric native graphics,
# Roborazzi) and publishes the PNGs to a branch of their own,
# `screenshots/<branch>`, so a change to the look can be reviewed without a
# device. The source branch is never written to.
#
# On request only: it is a review tool, not a gate. Either run it by hand, or
# put `[screenshots]` in a pushed commit's message (a manual run needs the
# workflow on the default branch first; the tag works from any branch).
on:
  workflow_dispatch:
  push:
    branches-ignore: ['screenshots/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-screenshots.yml'

permissions:
  # Only to push the screenshots branch.
  contents: write

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Record screenshots
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests 'com.webyar.operator.screenshots.*' -Proborazzi.test.record=true --stacktrace

      - name: Publish to screenshots/${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          out="$GITHUB_WORKSPACE/android/app/build/outputs/roborazzi"
          ls -la "$out"
          dest=$(mktemp -d)
          cp "$out"/*.png "$dest"/
          cd "$dest"
          git init -q -b main .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/screenshots/${GITHUB_REF_NAME}"
          echo "Published $(ls *.png | wc -l) screenshots to screenshots/${GITHUB_REF_NAME}"
