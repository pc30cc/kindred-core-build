name: Android

# Not on every push. This runs on hardware that also serves the Supabase
# stack (ADR-003 §5), so it is scoped to the paths that can actually break it,
# plus a manual trigger and a weekly sweep to catch drift in the toolchain
# rather than in the code.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (GitHub-hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Toolchain
        run: |
          set -eu
          "$JAVA_HOME/bin/java" -version
          echo "SDK: $(ls $ANDROID_HOME)"
          echo "platforms: $(ls $ANDROID_HOME/platforms)"
          echo "build-tools: $(ls $ANDROID_HOME/build-tools)"

      # Google's Maven answers 404 over this host's IPv6 route and 200 over
      # IPv4 — see the note in android/gradle.properties, which sets
      # -Djava.net.preferIPv4Stack=true for the build JVM. This step fails
      # loudly and early if that ever stops being true, because the symptom
      # further down is "Could not find androidx.core:core-ktx", which reads
      # like a wrong version rather than a network fault.
      - name: Google Maven is reachable
        run: |
          set -eu
          code=$(curl -4 -sSL -o /dev/null -w '%{http_code}' \
            https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/1.12.0/core-ktx-1.12.0.pom)
          echo "IPv4 -> $code"
          [ "$code" = "200" ] || { echo "Google Maven unreachable over IPv4"; exit 1; }

      # LiveKit depends on `com.github.davidliu:audioswitch` at a commit hash,
      # which exists only on JitPack. Same reasoning as the check above: when
      # JitPack is unreachable the symptom is "Could not find
      # com.github.davidliu:audioswitch:039a35ae…", which reads like a wrong
      # coordinate rather than a network fault, and somebody spends an hour
      # on the wrong problem.
      #
      # The probe is the artifact's own directory, NOT `maven-metadata.xml`.
      # JitPack publishes no metadata for a commit-hash version — there are no
      # releases to list — so that URL answers 404 while everything is working,
      # which is how the first version of this step spent four runs failing a
      # build it had not got as far as starting. The three answers this one can
      # get are all distinct and all were checked against the live service:
      # 200 with a listing of commit hashes, 401 "Repo not found" when the
      # coordinate is wrong, and nothing at all when JitPack is down.
      - name: JitPack is reachable
        run: |
          set -eu
          url=https://jitpack.io/com/github/davidliu/audioswitch/
          code=$(curl -4 -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
          echo "IPv4 -> $code"
          case "$code" in
            200) echo "reachable" ;;
            000) echo "JitPack did not answer at all — network, DNS or TLS"; exit 1 ;;
            *)   echo "JitPack answered $code for $url — the coordinate is gone"; exit 1 ;;
          esac

      # `:app:` rather than a bare task name, which would run it in every
      # module. `:baselineprofile` is a macrobenchmark module: its output is a
      # test APK that only means anything with a device attached, and this
      # host has no device and 2GB to spend. Building it here would download
      # uiautomator and the benchmark runner to produce an artifact nothing
      # on this machine can execute.
      - name: Build debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      # The JVM layer, which is where most of the suite lives: no device, no
      # KVM, no emulator (ADR-003 §5). Instrumented tests are a separate job
      # on a schedule, because the emulator's ~4GB does not coexist with a
      # build and Supabase at once.
      - name: Unit tests (JVM)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Test report
        if: ${{ !cancelled() }}
        working-directory: android
        run: |
          set -eu
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -e "$f" ] || continue
            sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/\1: \2 tests, \4 failures, \5 errors/p' "$f"
          done

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: APK
        working-directory: android
        run: |
          set -eu
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      # R8 is the difference between the app that is tested and the app that
      # ships: it renames, inlines and deletes, and a keep rule that is
      # missing shows up as an inbox of blank rows rather than a crash. This
      # is the only thing that checks the rules are still right.
      #
      # NOT on push, deliberately. R8 over fifty megabytes of WebRTC is the
      # heaviest thing this build does, and this host has a 2GB ceiling with
      # the production Supabase stack in the other half of it. The debug
      # build alone already peaks at 1537MB. Once a week and on demand is
      # enough to catch a rule that has gone stale; every push is how you
      # take the database down to check a ProGuard file.
      - name: Minified build (R8)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        working-directory: android
        run: |
          set -eu
          ./gradlew :app:assembleMinified --stacktrace
          find app/build/outputs/apk/minified -name '*.apk' -exec ls -lh {} \;

# NO EMULATOR JOB YET, and that is a measurement rather than an omission.
#
# ADR-003 §6 reserves instrumented tests for what Robolectric genuinely cannot
# answer — real IME behaviour, which is the hardest part of the iOS suite. The
# host cannot host one today: the JVM build alone peaks at 1537MB of ci.slice's
# 2048MB ceiling, with ~18k reclaim events and 2.3GB of swap in use, and an
# emulator wants ~4GB more on top of that while Supabase is the other thing in
# the room.
#
# It is not a missing feature of the runner: /dev/kvm is present and works.
# It is RAM. When this host has more, the job is a separate `runs-on` entry
# with `reactivecircus/android-emulator-runner`, on a schedule and never on a
# push.
