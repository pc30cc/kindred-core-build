name: Android

# Not on every push. This runs on hardware that also serves the Supabase
# stack (ADR-003 §5), so it is scoped to the paths that can actually break it,
# plus a manual trigger and a weekly sweep to catch drift in the toolchain
# rather than in the code.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (self-hosted)
    runs-on: [self-hosted, linux, x64, android]
    timeout-minutes: 30

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      # No daemon in CI: this host has 2GB from ci.slice and nothing should
      # outlive the job holding any of it.
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          set -eu
          "$JAVA_HOME/bin/java" -version
          echo "SDK: $(ls $ANDROID_HOME)"
          echo "platforms: $(ls $ANDROID_HOME/platforms)"
          echo "build-tools: $(ls $ANDROID_HOME/build-tools)"

      # Google's Maven answers 404 over this host's IPv6 route and 200 over
      # IPv4 — see the note in android/gradle.properties, which sets
      # -Djava.net.preferIPv4Stack=true for the build JVM. This step fails
      # loudly and early if that ever stops being true, because the symptom
      # further down is "Could not find androidx.core:core-ktx", which reads
      # like a wrong version rather than a network fault.
      - name: Google Maven is reachable
        run: |
          set -eu
          code=$(curl -4 -sSL -o /dev/null -w '%{http_code}' \
            https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/1.12.0/core-ktx-1.12.0.pom)
          echo "IPv4 -> $code"
          [ "$code" = "200" ] || { echo "Google Maven unreachable over IPv4"; exit 1; }

      - name: Build debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # The JVM layer, which is where most of the suite lives: no device, no
      # KVM, no emulator (ADR-003 §5). Instrumented tests are a separate job
      # on a schedule, because the emulator's ~4GB does not coexist with a
      # build and Supabase at once.
      - name: Unit tests (JVM)
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Test report
        if: ${{ !cancelled() }}
        working-directory: android
        run: |
          set -eu
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -e "$f" ] || continue
            sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/\1: \2 tests, \4 failures, \5 errors/p' "$f"
          done

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace

      - name: APK
        working-directory: android
        run: |
          set -eu
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

# NO EMULATOR JOB YET, and that is a measurement rather than an omission.
#
# ADR-003 §6 reserves instrumented tests for what Robolectric genuinely cannot
# answer — real IME behaviour, which is the hardest part of the iOS suite. The
# host cannot host one today: the JVM build alone peaks at 1537MB of ci.slice's
# 2048MB ceiling, with ~18k reclaim events and 2.3GB of swap in use, and an
# emulator wants ~4GB more on top of that while Supabase is the other thing in
# the room.
#
# It is not a missing feature of the runner: /dev/kvm is present and works.
# It is RAM. When this host has more, the job is a separate `runs-on` entry
# with `reactivecircus/android-emulator-runner`, on a schedule and never on a
# push.
