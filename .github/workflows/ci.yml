name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (typecheck, lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck (app)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Typecheck (server + worker)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:server

      # Non-regression gate, not a clean-tree gate: the repo carries thousands
      # of pre-existing findings, so `eslint .` alone would be red forever and
      # enforce nothing. This fails only when a commit ADDS problems.
      - name: Lint (non-regression baseline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:baseline

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      # Real database proof: the durable entitlement fan-out queue (lease
      # ownership, expiry reclaim, generation-bound cursors, concurrency-safe
      # enqueue), the worker loop itself and the transactional AI-KB draft
      # mutations all run against a live PostgreSQL, not mocked.
      #
      # --no-file-parallelism: these suites install schema into ONE shared
      # database, so they must not run concurrently.
      - name: Integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: bunx vitest run src/test/integration --exclude '**/cleanInstallMigrationChain.pg.test.ts' --no-file-parallelism

  clean-install:
    name: Clean-install migration chain (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      # A database that has never seen a migration, and roles that do not exist
      # yet: the only honest proof that a self-hoster can run the chain.
      - name: Create a pristine database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS clean_install' -c 'CREATE DATABASE clean_install'

      - name: Clean-install migration proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CLEAN_INSTALL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clean_install
        run: bunx vitest run src/test/integration/cleanInstallMigrationChain.pg.test.ts
