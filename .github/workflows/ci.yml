name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (typecheck, lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lint:changed needs history to resolve a merge base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck (app)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Typecheck (server + worker)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:server

      # Strict gate: every file touched by this change must be fully
      # ESLint-error-clean. Pre-existing baseline debt does not exempt a file
      # once it is edited.
      - name: Lint (changed files must be clean)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run lint:changed

      # Non-regression gate, not a clean-tree gate: the repo carries thousands
      # of pre-existing findings, so `eslint .` alone would be red forever and
      # enforce nothing. This fails when a commit ADDS problems anywhere —
      # per file, per rule and in total. The baseline is NEVER regenerated here.
      - name: Lint (per-file / per-rule non-regression baseline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:baseline

      # Full legacy debt report — informational, never gating.
      - name: Lint debt report (informational)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run lint

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      # Real database proof: the durable entitlement fan-out queue (lease
      # ownership, expiry reclaim, generation-bound cursors, concurrency-safe
      # enqueue), the worker loop itself and the transactional AI-KB draft
      # mutations all run against a live PostgreSQL, not mocked.
      #
      # --no-file-parallelism: these suites install schema into ONE shared
      # database, so they must not run concurrently.
      - name: Integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: bunx vitest run src/test/integration --exclude '**/aiKbTailMigrationCompatibility.pg.test.ts' --no-file-parallelism

  ai-kb-tail-migration:
    name: AI-KB tail migration compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      # A database that has never seen a migration, and roles that do not exist
      # yet. Scope is the AI-KB / fan-out TAIL (000 + 007→012) only — the FULL
      # chains are proven by the two dedicated full-chain jobs below.
      - name: Create a pristine database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS ai_kb_tail' -c 'CREATE DATABASE ai_kb_tail'

      - name: AI-KB tail migration proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TAIL_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_kb_tail
        run: bunx vitest run src/test/integration/aiKbTailMigrationCompatibility.pg.test.ts

  hosted-supabase-chain:
    name: Hosted Supabase full migration chain
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The real hosted runner: the Supabase CLI applying supabase/migrations
      # in timestamp order against a Supabase-compatible stack. No handcrafted
      # schema, no skipping, no mocked auth.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` would make this proof non-reproducible.
          version: 2.34.3

      - name: Fail if the Supabase CLI or Docker is unavailable
        run: |
          set -euo pipefail
          supabase --version
          docker version

      - name: Start Supabase (database stack)
        run: |
          set -euo pipefail
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Reset database and apply every migration in timestamp order
        run: supabase db reset --debug

      - name: Structural verification (full chain)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/ci/verify-hosted-chain.sql

      - name: Database security verification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/ci/verify-migration-security.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  selfhost-chain:
    name: Self-host full migration chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The documented self-host database image. It ships the Supabase `auth`
    # schema and helpers that migrations 001–003 reference, so the full
    # 000 → 012 chain can be applied for real rather than partially.
    services:
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if the database service did not start
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT version()'

      - name: Create a pristine database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS selfhost' -c 'CREATE DATABASE selfhost'

      # Exact filename order, ON_ERROR_STOP, no skipping, no function reset,
      # no handcrafted fixtures.
      - name: Apply database/migrations 000 → 012 in filename order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(database/migrations/*.sql)
          IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          if [ "${#files[@]}" -lt 13 ]; then
            echo "expected the full chain, found ${#files[@]} files"; exit 1
          fi
          for f in "${files[@]}"; do
            echo "── applying $f"
            psql -h localhost -U postgres -d selfhost -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Structural verification (self-host chain)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d selfhost -v ON_ERROR_STOP=1 \
            -f scripts/ci/verify-selfhost-chain.sql

      - name: Database security verification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d selfhost -v ON_ERROR_STOP=1 \
            -f scripts/ci/verify-migration-security.sql
