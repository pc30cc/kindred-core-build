name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single, workflow-level, IMMUTABLE reference to the official Supabase Auth
# (GoTrue) image. Preflight and the migration step both read this one variable,
# so they can never drift apart. `supabase/gotrue` is the registry-confirmed
# repository for this index digest; the tag alone is mutable, the digest is not.
env:
  AUTH_IMAGE: supabase/gotrue:v2.194.0@sha256:2b352c02adf11a2025cd5993c246ef85db73743553c39194d2b1862d1cc4d1fd

jobs:
  validate:
    name: Validate (typecheck, lint, tests, build)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64","android"]') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lint:changed needs history to resolve a merge base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck (app)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Typecheck (server + worker)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:server

      # Strict gate: every file touched by this change must be fully
      # ESLint-error-clean. Pre-existing baseline debt does not exempt a file
      # once it is edited.
      - name: Lint (changed files must be clean)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run lint:changed

      # Non-regression gate, not a clean-tree gate: the repo carries thousands
      # of pre-existing findings, so `eslint .` alone would be red forever and
      # enforce nothing. This fails when a commit ADDS problems anywhere —
      # per file, per rule and in total. The baseline is NEVER regenerated here.
      - name: Lint (per-file / per-rule non-regression baseline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:baseline

      # Full legacy debt report — informational, never gating.
      - name: Lint debt report (informational)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run lint

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64","android"]') }}
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      # Real database proof: the durable entitlement fan-out queue (lease
      # ownership, expiry reclaim, generation-bound cursors, concurrency-safe
      # enqueue), the worker loop itself and the transactional AI-KB draft
      # mutations all run against a live PostgreSQL, not mocked.
      #
      # --no-file-parallelism: these suites install schema into ONE shared
      # database, so they must not run concurrently.
      # internalTestGatewayE2E.pg.test.ts replays the FULL Billing Engine V2
      # migration chain in its own beforeAll (same as billingEngineV2.pg.test.ts
      # itself) — sharing this database with it would re-run migration 116's
      # backfill on top of billingEngineV2's own test mutations and trip its
      # data-integrity check. Both get a dedicated fresh database in the
      # ai-billing-db job below instead.
      # billingEngineV2 / billingV2PhaseC / billingV2PhaseD0 replay the V2
      # chain from 113 as well, and 113's CHECK constraints predate source
      # values that later suites now write into billing_subscription_periods
      # on the shared database. Each already runs on its own database in
      # ai-billing-db, so they are excluded here rather than skipped.
      - name: Integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: bunx vitest run src/test/integration --exclude '**/aiKbTailMigrationCompatibility.pg.test.ts' --exclude '**/internalTestGatewayE2E.pg.test.ts' --exclude '**/billingProviderCredentialsMigration.pg.test.ts' --exclude '**/billingEngineV2.pg.test.ts' --exclude '**/billingV2PhaseC.pg.test.ts' --exclude '**/billingV2PhaseD0.pg.test.ts' --no-file-parallelism

  # MANDATORY financial gate. AI money invariants (advisory locks, immutable
  # usage ingestion, lot allocation, refunds, recovery lease, ACL) are proven
  # against a real PostgreSQL. REQUIRE_BILLING_DB=1 makes the suite FAIL rather
  # than skip if the database environment is missing, so a merge can never be
  # green on absent financial tests.
  ai-billing-db:
    name: AI Billing financial tests (PostgreSQL, mandatory)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64","android"]') }}
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      - name: Fail if the database service did not start
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d billing -v ON_ERROR_STOP=1 -c 'SELECT version()'

      - name: AI Billing financial invariants
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing
          REQUIRE_BILLING_DB: '1'
        run: bunx vitest run src/test/integration/aiBillingFinancial.pg.test.ts --no-file-parallelism

      # Billing Engine V2 runs on its OWN database: the V2 chain and the AI
      # billing chain are different migration sets and must not share state.
      # REQUIRE_BILLING_DB=1 makes a missing database FAIL the job instead of
      # skipping — money invariants must never pass by absence.
      - name: Create Billing Engine V2 database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d billing -v ON_ERROR_STOP=1 -c 'CREATE DATABASE billing_v2'

      - name: Billing Engine V2 invariants (Phase A + Phase B rollout)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_v2
          REQUIRE_BILLING_DB: '1'
        run: bunx vitest run src/test/integration/billingEngineV2.pg.test.ts --no-file-parallelism

      # Phase C schedulers get a FRESH database: the renewal/auto-pay/activation
      # invariants must hold on a clean forward apply of 113–118.
      - name: Create Billing Engine V2 Phase C database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d billing -v ON_ERROR_STOP=1 -c 'CREATE DATABASE billing_v2_phase_c'

      - name: Billing Engine V2 invariants (Phase C schedulers)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_v2_phase_c
          REQUIRE_BILLING_DB: '1'
        run: bunx vitest run src/test/integration/billingV2PhaseC.pg.test.ts --no-file-parallelism

      # Phase D0 entitlement cycles also demand a FRESH database: an annual
      # plan must release AI allowance month by month, never 12x on day one.
      - name: Create Billing Engine V2 Phase D0 database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d billing -v ON_ERROR_STOP=1 -c 'CREATE DATABASE billing_v2_phase_d0'

      - name: Billing Engine V2 invariants (Phase D0 entitlement cycles)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_v2_phase_d0
          REQUIRE_BILLING_DB: '1'
        run: bunx vitest run src/test/integration/billingV2PhaseD0.pg.test.ts --no-file-parallelism

      # Internal Test Gateway E2E replays the SAME migration chain as Billing
      # Engine V2 (above) — it needs its own fresh database, never a shared one.
      - name: Create Internal Test Gateway E2E database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d billing -v ON_ERROR_STOP=1 -c 'CREATE DATABASE billing_internal_test_gateway'

      - name: Internal Test Gateway E2E (checkout -> verify -> settlement -> AI credit) + ZarinPal sandbox contract
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_internal_test_gateway
          REQUIRE_BILLING_DB: '1'
        run: bunx vitest run src/test/integration/internalTestGatewayE2E.pg.test.ts --no-file-parallelism

      # The provider-credentials migration test seeds its OWN minimal
      # pre-migration schema (it does not depend on the Billing Engine V2
      # chain), but still gets a fresh database for isolation.
      - name: Create billing provider credentials migration database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d billing -v ON_ERROR_STOP=1 -c 'CREATE DATABASE billing_provider_credentials'

      - name: billing_provider_credentials migration (137) — one canonical provider-settings source
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing_provider_credentials
          REQUIRE_BILLING_DB: '1'
        run: bunx vitest run src/test/integration/billingProviderCredentialsMigration.pg.test.ts --no-file-parallelism

      - name: AI Billing in-process suites (context propagation, scheduler, failure semantics)
        run: bunx vitest run src/test/aiBilling


  ai-kb-tail-migration:
    name: AI-KB tail migration compatibility
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64","android"]') }}
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      # A database that has never seen a migration, and roles that do not exist
      # yet. Scope is the AI-KB / fan-out TAIL (000 + 007→012) only — the FULL
      # chains are proven by the two dedicated full-chain jobs below.
      - name: Create a pristine database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS ai_kb_tail' -c 'CREATE DATABASE ai_kb_tail'

      - name: AI-KB tail migration proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TAIL_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_kb_tail
        run: bunx vitest run src/test/integration/aiKbTailMigrationCompatibility.pg.test.ts

  hosted-supabase-chain:
    name: Hosted Supabase full migration chain
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64","android"]') }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The real hosted runner: the Supabase CLI applying supabase/migrations
      # in timestamp order against a Supabase-compatible stack. No handcrafted
      # schema, no skipping, no mocked auth.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` would make this proof non-reproducible.
          #
          # Was 2.34.3, which cannot parse this repo's own SQL. Its statement
          # splitter (pkg/parser/state.go) starts a BEGIN ATOMIC function body
          # whenever the six characters it just read spell "atomic", with no
          # word-boundary check -- the file's own comment admits the hazard for
          # a column named ATOMIC. We have a *function* named
          # `public.wi_fail_otp_job_atomic`, so from its opening paren the
          # splitter swallows every `;` until some later text happens to spell
          # "end" (it does, inside `wi_otp_job_sendable`), by which point three
          # CREATE FUNCTIONs are one chunk and Postgres answers "cannot insert
          # multiple commands into a prepared statement".
          #
          # The SQL is valid: the self-host job applies the same statements
          # through psql without complaint. It is the tool that cannot read it,
          # and the function's name is in migration history we do not rewrite.
          # Reproduced on 2.34.3 and confirmed fixed on 2.117.0, which is also
          # closer to the 17.6 Postgres production actually runs.
          version: 2.117.0

      - name: Fail if the Supabase CLI or Docker is unavailable
        run: |
          set -euo pipefail
          supabase --version
          docker version

      # ghcr.io rate-limits shared runners ("toomanyrequests") before a single
      # migration runs. The same official images are mirrored on
      # public.ecr.aws, so a failed pull falls back there instead of failing
      # the proof on registry load.
      - name: Start Supabase (database stack)
        run: |
          set -euo pipefail
          EXCLUDE=realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
          if ! supabase start -x "$EXCLUDE"; then
            echo '::warning::supabase start failed on the default registry; retrying from public.ecr.aws'
            supabase stop --no-backup || true
            SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws supabase start -x "$EXCLUDE"
          fi

      - name: Reset database and apply every migration in timestamp order
        run: supabase db reset --debug

      - name: Structural verification (full chain)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/ci/verify-hosted-chain.sql

      - name: Database security verification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v require_ai_kb=1 \
            -v require_hosted_service_acl=1 \
            -f scripts/ci/verify-migration-security.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  selfhost-chain:
    name: Self-host full migration chain
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64","android"]') }}
    timeout-minutes: 30

    # The documented self-host database image. It ships the Supabase `auth`
    # schema helpers (`auth.uid()`, `auth.jwt()`) and the Supabase roles that
    # migrations 001–003 reference. The `auth` TABLES (auth.users …) are then
    # installed by the OFFICIAL GoTrue/Auth migrations below — never by a
    # handcrafted fixture — so the full 000 → 012 chain applies for real.
    services:
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if the database service did not start
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT version()'

      # The official Auth image, pinned by IMMUTABLE DIGEST (the tag alone is
      # mutable and could be repointed). Preflight proves the image is really
      # pullable, PRINTS the resolved architecture and RepoDigest, and proves
      # the binary really exposes `migrate` BEFORE the job depends on it — so an
      # unpullable/renamed image fails loudly here rather than looking like a
      # migration failure later.
      - name: Preflight — official Auth image is pullable and exposes `migrate`
        run: |
          set -euo pipefail
          echo "AUTH_IMAGE=$AUTH_IMAGE"
          docker pull "$AUTH_IMAGE"
          docker image inspect \
            --format '{{.Architecture}} {{json .RepoDigests}}' \
            "$AUTH_IMAGE"
          docker run --rm "$AUTH_IMAGE" gotrue --help 2>&1 | tee /tmp/gotrue-help.txt
          grep -Eq '(^|[[:space:]])migrate([[:space:]]|$)' /tmp/gotrue-help.txt

      # Official Supabase Auth (GoTrue) migrations, pinned by the same
      # workflow-level digest. This is the same binary a self-hoster runs;
      # `gotrue migrate` creates the `auth` schema objects (auth.users,
      # auth.schema_migrations, …) that migration 001 references. No mocked
      # auth tables anywhere in this job.
      - name: Bootstrap Supabase Auth schema (official GoTrue migrations)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e GOTRUE_DB_DRIVER=postgres \
            -e DB_NAMESPACE=auth \
            -e GOTRUE_API_HOST=localhost \
            -e PORT=9999 \
            -e API_EXTERNAL_URL=http://localhost:9999 \
            -e GOTRUE_SITE_URL=http://localhost:3000 \
            -e GOTRUE_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters \
            -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_EXP=3600 \
            -e GOTRUE_DISABLE_SIGNUP=false \
            -e 'DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable&search_path=auth' \
            -e 'GOTRUE_DB_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable&search_path=auth' \
            "$AUTH_IMAGE" gotrue migrate

      - name: Fail if the Auth bootstrap did not produce real auth tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN
               IF to_regclass('auth.users') IS NULL THEN
                 RAISE EXCEPTION 'auth.users missing — GoTrue migrations did not run';
               END IF;
               IF to_regprocedure('auth.uid()') IS NULL OR to_regprocedure('auth.jwt()') IS NULL THEN
                 RAISE EXCEPTION 'auth helpers missing — not a Supabase-compatible database';
               END IF;
             END \$\$;"

      # Exact filename order, ON_ERROR_STOP, no skipping, no function reset,
      # no handcrafted fixtures.
      - name: Apply database/migrations 000 → 015 in filename order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(database/migrations/*.sql)
          IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          if [ "${#files[@]}" -lt 16 ]; then
            echo "expected the full chain, found ${#files[@]} files"; exit 1
          fi
          for f in "${files[@]}"; do
            echo "── applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Structural verification (self-host chain)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/ci/verify-selfhost-chain.sql

      # `require_ai_kb=0`: the AI-KB tables ship in supabase/migrations only,
      # so the self-host chain proves the fan-out RPC lifecycle live and the
      # hosted chain additionally proves the AI-KB RPCs live.
      - name: Database security verification
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v require_ai_kb=0 \
            -v require_hosted_service_acl=0 \
            -f scripts/ci/verify-migration-security.sql
