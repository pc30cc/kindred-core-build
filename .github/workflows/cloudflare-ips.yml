name: Cloudflare IP ranges

# The backend believes cf-connecting-ip only from the Cloudflare ranges built
# into server/utils/clientIp.ts. This fails (and GitHub emails the owner) when
# Cloudflare publishes different ranges.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compare with api.cloudflare.com/client/v4/ips
        run: node scripts/security/check-cloudflare-ips.mjs
