name: Desktop release

# Builds the Windows app and publishes it to the public releases repo that the
# installed apps update from (see `publish` in windows/electron-builder.yml).
# Runs only when a version is tagged or on demand, never on ordinary pushes.
#
#   1. Bump "version" in windows/package.json.
#   2. Push a tag named desktop-v<that version>, e.g. desktop-v1.1.0.
#
# Needs the DESKTOP_RELEASES_TOKEN secret: a fine-grained token with
# "Contents: Read and write" on pc30cc/webyar-desktop-releases only.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "desktop-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build

      - name: Publish
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
