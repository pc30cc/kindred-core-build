# TEMPORARY (PR #428 only, removed before merge): the call widget's browser
# specs, which no CI job runs, against the language cut of the engine.
name: tmp call widget e2e
on:
  pull_request:
permissions:
  contents: read
jobs:
  call-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: callWidgetScreens (the loader in source, shipped and built modes)
        if: always()
        run: npx playwright test e2e/callWidgetScreens.spec.ts -g "boots through the real loader" --reporter=list
      - name: callWidgetBehaviour (all)
        if: always()
        run: npx playwright test e2e/callWidgetBehaviour.spec.ts --reporter=list
