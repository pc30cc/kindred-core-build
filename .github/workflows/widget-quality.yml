name: Widget Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, always-required gate: the single-design regression guard for the
  # chat widget. Kept as its own job so a template-system regression is
  # immediately visible and can be made a required status check.
  widget-guard:
    name: widget-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Widget single-design regression guard
        run: bunx vitest run src/test/widget/noTemplateSystem.test.ts

  # Full project validation with the repository's real commands.
  # No continue-on-error, no `|| true`, no disabled tests: if this is red,
  # the repository is genuinely red.
  typecheck-test-build:
    name: typecheck-test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        id: install
        run: bun install --frozen-lockfile

      - name: Typecheck (app)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Typecheck (server + worker)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:server

      - name: Widget single-design regression guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx vitest run src/test/widget/noTemplateSystem.test.ts

      - name: Full test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
