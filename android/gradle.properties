# The CI runner shares a host with the Supabase stack (ADR-003 §6), so the
# build states its own ceiling rather than discovering it through the OOM
# killer. 1g is comfortable for a single-module app; raise it deliberately, not
# reflexively, and check `systemctl show ci.slice -p MemoryMax` first.
#
# `org.gradle.daemon=false` belongs in the CI workflow, not here — a developer
# on a Mac wants the daemon, and CI wants nothing left behind between runs.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
# Four cores, shared with production.
org.gradle.workers.max=2

# preferIPv4Stack above is NOT boilerplate. On the CI host, dl.google.com
# resolves to IPv6 and every path under it answers 404 over that route —
# including POMs that certainly exist — while the same URL over IPv4 returns
# 200. Left alone, Gradle takes the IPv6 route and every androidx, AGP and
# Compose artifact fails to resolve, reported as "Could not find
# androidx.core:core-ktx:…", which reads exactly like a wrong version number
# and not like a network fault. Maven Central is unaffected; it is Google's
# edge only. Verified 2026-09-21: curl -6 -> 404, curl -4 -> 200.

android.useAndroidX=true
# R classes carry only this module's resources, not its dependencies' as well.
android.nonTransitiveRClass=true
kotlin.code.style=official
