# Versions resolved from Google's Maven and Maven Central on 2026-09-21, not
# from memory. Google's Maven answers only over IPv4 from the CI host — see
# the note in gradle.properties.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
ktor = "3.6.0"
serialization = "1.11.0"
coroutines = "1.11.0"
robolectric = "4.17"
androidxTestJunit = "1.3.0"
junit = "4.13.2"
desugar = "2.1.5"
coil = "3.6.3"
navigation = "2.10.1"
livekit = "2.29.0"
benchmark = "1.5.0"
uiautomator = "2.4.0"
espresso = "3.7.0"
profileinstaller = "1.4.1"

[libraries]
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# collectAsStateWithLifecycle: a flow collected from a composable must stop
# when the screen stops, or a backgrounded app keeps polling.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# The BOM decides every androidx.compose version below it, so none of them
# carry one of their own.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Named rather than left transitive: the icons used are from the CORE set,
# and material-icons-extended is a very large artifact to acquire by accident.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Ktor rather than Retrofit: APIClient.swift is a hand-rolled URLSession
# client, and Ktor is the closer shape — one `request` funnel with the auth
# header and the status mapping in it, rather than an annotated interface.
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Navigation Compose, for one NavHost with a nested graph per tab — which
# is what gives each tab its own back stack and its own saved state.
# Resolved from Google Maven 2026-09-21.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# LiveKit, for the calls. The SDK only — NOT livekit-android-compose-components,
# which pins its own Compose BOM and drags in Molecule for what amounts to one
# AndroidView around a renderer. That view is forty lines and is written here,
# where its lifecycle is visible.
# Resolved from Maven Central 2026-09-22.
livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }

# The baseline profile generator's own dependencies. They are in the
# `:baselineprofile` module and never in the app.
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# Coil rather than a hand-rolled loader: RemoteImage.swift is 236 lines of
# cache, placeholder and cancellation, and all three are things an image
# library has already got right. Resolved from Maven Central 2026-09-21.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Tests. Robolectric is what keeps the majority of the suite on the JVM and
# off an emulator, which is what keeps CI inside this host's budget.
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose's compiler ships with Kotlin itself since 2.0, so it is never
# versioned separately from the language. This and serialization below are the
# ONLY Kotlin plugins the project applies; AGP 9 compiles Kotlin on its own.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# The baseline profile's own module is a `com.android.test` project, and the
# plugin that generates the profile from it.
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
