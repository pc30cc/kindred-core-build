# NOT generated by Coolify. Serves each brand's desktop downloads from
# /data/app-downloads/<brand> (mounted at /data), outside the frontend image so
# the binaries never go into git or a build:
#   app.webyar.ai   → /data/webyar: Webyar-Windows*.zip, Webyar-Mac*.zip, windows/ (update feed)
#   app.respok.app  → /data/respok: RESPOK-Windows*.zip, RESPOK-Mac*.zip, windows/ (update feed)
# Traefik (traefik-app-downloads.yaml) sends only those paths here.
map $host $brand {
    default            "";
    app.webyar.ai      webyar;
    app.respok.app     respok;
}

server {
    listen 80;
    root /data;
    # Redirects name only the path: this server speaks plain HTTP behind Traefik's HTTPS.
    absolute_redirect off;
    if ($brand = "") { return 404; }

    # What people download, as zips: <Prefix>-Windows.zip (the installer, <Prefix>-Setup.exe) and
    # <Prefix>-Mac.zip (the DMG), symlinks to the newest <Prefix>-Windows-<version>.zip and
    # <Prefix>-Mac-<version>.zip.
    location ~ ^/downloads/((Webyar|RESPOK)-(Windows|Mac)(-[0-9][A-Za-z0-9.\-]*)?\.zip)$ {
        alias /data/$brand/$1;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    # The links of before, to the installer and the DMG themselves (sites, Super Admin, docs),
    # lead to the same version's zip.
    location ~ ^/downloads/(Webyar|RESPOK)-Setup(-[0-9][A-Za-z0-9.\-]*)?\.exe$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        return 302 /downloads/$1-Windows$2.zip;
    }
    location ~ ^/downloads/(Webyar|RESPOK)-Mac(-[0-9][A-Za-z0-9.\-]*)?\.dmg$ {
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        return 302 /downloads/$1-Mac$2.zip;
    }
    # The Windows app's update feed (Velopack), mirrored by sync-downloads.sh:
    # the installed apps read releases.win.json and download the packages it names.
    location ~ ^/downloads/windows/(releases\.win\.json|RELEASES|[A-Za-z0-9.\-]+\.nupkg)$ {
        alias /data/$brand/windows/$1;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    location / { return 404; }
}
