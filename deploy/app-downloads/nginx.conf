# NOT generated by Coolify. Serves each brand's desktop downloads from
# /data/app-downloads/<brand> (mounted at /data), outside the frontend image so
# the binaries never go into git or a build:
#   app.webyar.ai   → /data/webyar: Webyar-Setup*.exe, Webyar-Mac*.dmg, windows/ (update feed)
#   app.respok.app  → /data/respok: RESPOK-Setup*.exe, RESPOK-Mac*.dmg, windows/ (update feed)
# Traefik (traefik-app-downloads.yaml) sends only those paths here.
map $host $brand {
    default            "";
    app.webyar.ai      webyar;
    app.respok.app     respok;
}

server {
    listen 80;
    root /data;
    if ($brand = "") { return 404; }

    # The Windows installer: <Prefix>-Setup.exe is a symlink to the newest <Prefix>-Setup-<version>.exe.
    location ~ ^/downloads/((Webyar|RESPOK)-Setup[A-Za-z0-9.\-]*\.exe)$ {
        alias /data/$brand/$1;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    # The Mac app: <Prefix>-Mac.dmg is a symlink to the newest <Prefix>-Mac-<version>.dmg.
    location ~ ^/downloads/((Webyar|RESPOK)-Mac[A-Za-z0-9.\-]*\.dmg)$ {
        alias /data/$brand/$1;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    # The Windows app's update feed (Velopack), mirrored by sync-downloads.sh:
    # the installed apps read releases.win.json and download the packages it names.
    location ~ ^/downloads/windows/(releases\.win\.json|RELEASES|[A-Za-z0-9.\-]+\.nupkg)$ {
        alias /data/$brand/windows/$1;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    location / { return 404; }
}
