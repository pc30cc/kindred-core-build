# NOT generated by Coolify. Serves each brand's desktop downloads from
# /data/app-downloads/<brand> (mounted at /data), outside the frontend image so
# the binaries never go into git or a build:
#   app.webyar.ai   → /data/webyar: Webyar-Setup*.exe, Webyar-Mac*.dmg, Webyar-{Windows,Mac,Android}*.zip,
#                     windows/ (update feed)
#   app.respok.app  → /data/respok: the same files named RESPOK-*
# (The APKs themselves, <Prefix>-Android.apk, are the frontend's own.)
# Traefik (traefik-app-downloads.yaml) sends only those paths here.
map $host $brand {
    default            "";
    app.webyar.ai      webyar;
    app.respok.app     respok;
}

server {
    listen 80;
    root /data;
    # Any redirect names only the path: this server speaks plain HTTP behind Traefik's HTTPS.
    absolute_redirect off;
    if ($brand = "") { return 404; }

    # What people download, as zips: <Prefix>-Windows.zip (the installer), <Prefix>-Mac.zip (the DMG)
    # and <Prefix>-Android.zip (the APK), symlinks to the newest <Prefix>-<Platform>-<version>.zip.
    location ~ ^/downloads/((Webyar|RESPOK)-(Windows|Mac|Android)(-[0-9][A-Za-z0-9.\-]*)?\.zip)$ {
        alias /data/$brand/$1;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    # And as they are: <Prefix>-Setup.exe (the Windows installer) and <Prefix>-Mac.dmg, symlinks to the
    # newest <Prefix>-Setup-<version>.exe and <Prefix>-Mac-<version>.dmg.
    location ~ ^/downloads/((Webyar|RESPOK)-Setup(-[0-9][A-Za-z0-9.\-]*)?\.exe)$ {
        alias /data/$brand/$1;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    location ~ ^/downloads/((Webyar|RESPOK)-Mac(-[0-9][A-Za-z0-9.\-]*)?\.dmg)$ {
        alias /data/$brand/$1;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    # The Windows app's update feed (Velopack), mirrored by sync-downloads.sh:
    # the installed apps read releases.win.json and download the packages it names.
    location ~ ^/downloads/windows/(releases\.win\.json|RELEASES|[A-Za-z0-9.\-]+\.nupkg)$ {
        alias /data/$brand/windows/$1;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    location / { return 404; }
}
