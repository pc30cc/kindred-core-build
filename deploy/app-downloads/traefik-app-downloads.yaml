# NOT generated by Coolify. Hand-written, safe to delete.
# Each brand's desktop downloads live on the host (/data/app-downloads/<brand>)
# and are served by the app-downloads nginx container; these routers send only
# the downloads (the zips, and the old installer and DMG links, which redirect to
# them) and the Windows update feed there, per site. Everything
# else under /downloads/ (the plugins, the Android APK) still goes to the frontend.
http:
  routers:
    webyar-app-downloads:
      entryPoints:
        - https
      rule: "Host(`app.webyar.ai`) && PathRegexp(`^/downloads/(Webyar-(Windows|Mac)[A-Za-z0-9.\\-]*\\.zip|Webyar-Setup[A-Za-z0-9.\\-]*\\.exe|Webyar-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: app-downloads
    webyar-app-downloads-http:
      entryPoints:
        - http
      rule: "Host(`app.webyar.ai`) && PathRegexp(`^/downloads/(Webyar-(Windows|Mac)[A-Za-z0-9.\\-]*\\.zip|Webyar-Setup[A-Za-z0-9.\\-]*\\.exe|Webyar-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      service: app-downloads
    respok-app-downloads:
      entryPoints:
        - https
      rule: "Host(`app.respok.app`) && PathRegexp(`^/downloads/(RESPOK-(Windows|Mac)[A-Za-z0-9.\\-]*\\.zip|RESPOK-Setup[A-Za-z0-9.\\-]*\\.exe|RESPOK-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: app-downloads
    respok-app-downloads-http:
      entryPoints:
        - http
      rule: "Host(`app.respok.app`) && PathRegexp(`^/downloads/(RESPOK-(Windows|Mac)[A-Za-z0-9.\\-]*\\.zip|RESPOK-Setup[A-Za-z0-9.\\-]*\\.exe|RESPOK-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      service: app-downloads
  services:
    app-downloads:
      loadBalancer:
        servers:
          - url: "http://app-downloads:80"
