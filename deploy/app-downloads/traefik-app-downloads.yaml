# NOT generated by Coolify. Hand-written, safe to delete.
# Each brand's desktop downloads live on the host (/data/app-downloads/<brand>)
# and are served by the app-downloads nginx container; these routers send only
# the downloads (the installer, the DMG, and the Windows, Mac and Android zips)
# and the Windows update feed there, per site, and the other brand's file
# names, which answer 404 there. Everything else under /downloads/ (the plugins,
# the brand's own Android APK) still goes to the frontend.
http:
  routers:
    webyar-app-downloads:
      entryPoints:
        - https
      rule: "Host(`app.webyar.ai`) && PathRegexp(`^/downloads/(Webyar-(Windows|Mac|Android)[A-Za-z0-9.\\-]*\\.zip|Webyar-Setup[A-Za-z0-9.\\-]*\\.exe|Webyar-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: app-downloads
    webyar-app-downloads-http:
      entryPoints:
        - http
      rule: "Host(`app.webyar.ai`) && PathRegexp(`^/downloads/(Webyar-(Windows|Mac|Android)[A-Za-z0-9.\\-]*\\.zip|Webyar-Setup[A-Za-z0-9.\\-]*\\.exe|Webyar-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      service: app-downloads
    respok-app-downloads:
      entryPoints:
        - https
      rule: "Host(`app.respok.app`) && PathRegexp(`^/downloads/(RESPOK-(Windows|Mac|Android)[A-Za-z0-9.\\-]*\\.zip|RESPOK-Setup[A-Za-z0-9.\\-]*\\.exe|RESPOK-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: app-downloads
    respok-app-downloads-http:
      entryPoints:
        - http
      rule: "Host(`app.respok.app`) && PathRegexp(`^/downloads/(RESPOK-(Windows|Mac|Android)[A-Za-z0-9.\\-]*\\.zip|RESPOK-Setup[A-Za-z0-9.\\-]*\\.exe|RESPOK-Mac[A-Za-z0-9.\\-]*\\.dmg|windows/(releases\\.win\\.json|RELEASES|[A-Za-z0-9.\\-]+\\.nupkg))$`)"
      priority: 1000
      service: app-downloads
    # Each site never serves the other brand's downloads: its file names on this host (for example
    # the frontend image's Webyar-Android.apk on app.respok.app) go to app-downloads, which has no
    # such file for this host and answers 404.
    webyar-foreign-downloads:
      entryPoints:
        - https
      rule: "Host(`app.webyar.ai`) && PathPrefix(`/downloads/RESPOK-`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: app-downloads
    webyar-foreign-downloads-http:
      entryPoints:
        - http
      rule: "Host(`app.webyar.ai`) && PathPrefix(`/downloads/RESPOK-`)"
      priority: 1000
      service: app-downloads
    respok-foreign-downloads:
      entryPoints:
        - https
      rule: "Host(`app.respok.app`) && PathPrefix(`/downloads/Webyar-`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: app-downloads
    respok-foreign-downloads-http:
      entryPoints:
        - http
      rule: "Host(`app.respok.app`) && PathPrefix(`/downloads/Webyar-`)"
      priority: 1000
      service: app-downloads
  services:
    app-downloads:
      loadBalancer:
        servers:
          - url: "http://app-downloads:80"
