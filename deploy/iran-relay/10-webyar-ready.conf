# WebYar's Iran relay (README.md next to this). Goes in
# /etc/systemd/system/coturn.service.d/ before `apt-get install coturn`.
#
# The package enables and starts coturn at install, with the package's own
# /etc/turnserver.conf rather than WebYar's (no shared secret, no peer
# limits). This keeps the stock unit from starting (systemd skips it; it does
# not fail) until configure.sh has written WebYar's config and touched
# /etc/webyar-turn/ready.
[Unit]
ConditionPathExists=/etc/webyar-turn/ready
