# TileServer GL — self-hosted raster + vector tile server.
# Deploy on Coolify as "Docker Compose" service.
#
# Place your .mbtiles file in the mounted /data volume before first start.
# See deploy/tileserver/README.md for the full deploy guide.
services:
  tileserver:
    # NOTE: We use `tileserver-gl-light` instead of the full `tileserver-gl`
    # because the full image depends on `sharp` (libvips) whose prebuilt
    # binaries require x86-64-v2 microarchitecture. Many budget VPS / older
    # bare-metal CPUs are still x86-64-v1, which causes:
    #   "Could not load the sharp module ... Unsupported CPU"
    # The `-light` variant has no native rasterization deps and serves
    # vector tiles + styled raster tiles (rendered client-side by MapLibre)
    # which is exactly what our Visitors map needs.
    image: maptiler/tileserver-gl-light:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # Persist .mbtiles + custom styles across rebuilds.
      # In Coolify: attach a "Persistent Storage" volume to /data.
      - tileserver-data:/data
    command: ["--public_url", "/", "--port", "8080"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tileserver-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      tileserver:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./deploy/tileserver/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tileserver-data:
    # Coolify replaces this with a managed persistent volume.