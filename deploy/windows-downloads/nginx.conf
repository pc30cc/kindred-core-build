# NOT generated by Coolify. Serves the Windows app installer at
# https://app.webyar.ai/downloads/Webyar-Setup*.exe, the Android app at
# https://app.webyar.ai/downloads/Webyar-Android*.apk and the Mac app at
# https://app.webyar.ai/downloads/Webyar-Mac*.dmg from /data/webyar-downloads/files,
# outside the frontend image so the binaries never go into git or a build.
server {
    listen 80;
    root /data;
    location ~ ^/downloads/(Webyar-Setup[A-Za-z0-9.\-]*\.exe)$ {
        alias /data/$1;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    # The Android app, for installing by hand (outside Google Play):
    # Webyar-Android.apk is a symlink to the current Webyar-Android-<version>.apk.
    location ~ ^/downloads/(Webyar-Android[A-Za-z0-9.\-]*\.apk)$ {
        alias /data/$1;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    # The Mac app: Webyar-Mac.dmg is a symlink to the current Webyar-Mac-<version>.dmg.
    location ~ ^/downloads/(Webyar-Mac[A-Za-z0-9.\-]*\.dmg)$ {
        alias /data/$1;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    location / { return 404; }
}
