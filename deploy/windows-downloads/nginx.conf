# Serves the Windows app installer at
# https://app.webyar.ai/downloads/Webyar-Setup*.exe from /data/webyar-downloads/files,
# outside the frontend image so an 88 MB binary never goes into git or a build.
server {
    listen 80;
    root /data;
    location ~ ^/downloads/(Webyar-Setup[A-Za-z0-9.\-]*\.exe)$ {
        alias /data/$1;
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        add_header Cache-Control "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    location / { return 404; }
}
