# NOT generated by Coolify. Hand-written, safe to delete.
# The Windows installer and the Mac DMG live on the host
# (/data/webyar-downloads/files) and are served by the webyar-downloads nginx
# container; this router sends only /downloads/Webyar-Setup*.exe and
# /downloads/Webyar-Mac*.dmg on app.webyar.ai there. Everything else under
# /downloads/ goes to the frontend — the plugins, and the Android APK, which
# ships in the frontend image from public/downloads/.
http:
  routers:
    webyar-downloads:
      entryPoints:
        - https
      rule: "(Host(`app.webyar.ai`) || Host(`www.app.webyar.ai`)) && PathRegexp(`^/downloads/(Webyar-Setup[A-Za-z0-9.\\-]*\\.exe|Webyar-Mac[A-Za-z0-9.\\-]*\\.dmg)$`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: webyar-downloads
    webyar-downloads-http:
      entryPoints:
        - http
      rule: "(Host(`app.webyar.ai`) || Host(`www.app.webyar.ai`)) && PathRegexp(`^/downloads/(Webyar-Setup[A-Za-z0-9.\\-]*\\.exe|Webyar-Mac[A-Za-z0-9.\\-]*\\.dmg)$`)"
      priority: 1000
      service: webyar-downloads
  services:
    webyar-downloads:
      loadBalancer:
        servers:
          - url: "http://webyar-downloads:80"
