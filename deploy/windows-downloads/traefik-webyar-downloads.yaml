# NOT generated by Coolify. Hand-written, safe to delete.
# The Windows installer lives on the host (/data/webyar-downloads/files) and is
# served by the webyar-downloads nginx container; this router sends only
# /downloads/Webyar-Setup*.exe on app.webyar.ai there. Everything else under
# /downloads/ (the WooCommerce plugin) still goes to the frontend.
http:
  routers:
    webyar-downloads:
      entryPoints:
        - https
      rule: "(Host(`app.webyar.ai`) || Host(`www.app.webyar.ai`)) && PathRegexp(`^/downloads/Webyar-Setup[A-Za-z0-9.\\-]*\\.exe$`)"
      priority: 1000
      tls:
        certResolver: letsencrypt
      service: webyar-downloads
    webyar-downloads-http:
      entryPoints:
        - http
      rule: "(Host(`app.webyar.ai`) || Host(`www.app.webyar.ai`)) && PathRegexp(`^/downloads/Webyar-Setup[A-Za-z0-9.\\-]*\\.exe$`)"
      priority: 1000
      service: webyar-downloads
  services:
    webyar-downloads:
      loadBalancer:
        servers:
          - url: "http://webyar-downloads:80"
