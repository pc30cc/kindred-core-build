# docker-compose.centrifugo.yml
#
# Production-ready Centrifugo deployment for this project.
# Designed to be deployed as a STANDALONE service in Coolify
# (separately from the backend/frontend), reachable via a public domain
# such as: rt.destekly.tr  (wss://rt.destekly.tr)
#
# Coolify deployment settings (must match exactly):
#   Build Pack             : Docker Compose
#   Docker Compose Location: docker-compose.centrifugo.yml   (NO leading slash)
#   Custom Build Command   : (leave empty)
#   Custom Start Command   : (leave empty)
#
# Why standalone?
#   The Express backend and the Vite frontend are deployed as separate
#   Coolify services. They will NOT share a Docker network with this
#   container, so the backend cannot reach Centrifugo via an internal
#   hostname like `http://centrifugo:8000/api`. Both the public WS URL
#   and the server-to-server API URL must therefore be reachable over
#   the public domain (HTTPS terminated by Coolify's proxy).
#
# Required environment variables (set them in Coolify → this service → Env):
#   CENTRIFUGO_TOKEN_HMAC_SECRET   – HMAC secret for connection JWTs (HS256)
#   CENTRIFUGO_API_KEY             – Server-to-server HTTP API key
#   CENTRIFUGO_ALLOWED_ORIGINS     – Comma-separated origins allowed to connect
#                                    (e.g. https://destekly.tr,https://app.destekly.tr)
#   CENTRIFUGO_ADMIN_PASSWORD      – Admin UI password (optional, only if admin enabled)
#   CENTRIFUGO_ADMIN_SECRET        – Admin UI secret  (optional, only if admin enabled)
#
# After deploy, in Coolify add a domain (e.g. rt.destekly.tr) pointing to
# port 8000 of this container. Coolify will terminate TLS and proxy
# both HTTP (/api, /health) and WebSocket (/connection/websocket) traffic.

services:
  centrifugo:
    image: centrifugo/centrifugo:v5.4.5
    restart: unless-stopped
    command: centrifugo -c /centrifugo/config.json
    # NOTE: Do NOT publish the port to the host with `ports:`.
    # Coolify's reverse proxy talks to the container over the internal
    # Docker network using the `expose`d port. Publishing 8000:8000 will
    # fail on hosts where port 8000 is already in use.
    expose:
      - "8000"
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      # IMPORTANT: Centrifugo's official env var name for the HMAC secret is
      # CENTRIFUGO_TOKEN_HMAC_SECRET_KEY (it maps to the JSON config key
      # `token_hmac_secret_key`). We accept the value from the simpler
      # CENTRIFUGO_TOKEN_HMAC_SECRET shell variable that the operator sets
      # in Coolify — this matches the field name used in the backend admin
      # UI (Super Admin → Providers → Realtime → "HMAC Token Secret").
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Healthcheck uses Centrifugo's built-in `healthcheck` subcommand.
    # The official image is built FROM scratch and ships NO wget/curl/sh,
    # so an HTTP-based healthcheck (wget/curl) would always fail and
    # Coolify would mark the service as `unhealthy`. The `centrifugo
    # healthcheck` subcommand is shipped inside the same static binary
    # and queries the local /health endpoint internally.
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "-c", "/centrifugo/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "coolify.managed=true"
      - "coolify.service=centrifugo"
