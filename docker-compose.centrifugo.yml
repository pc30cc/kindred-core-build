# docker-compose.centrifugo.yml
#
# Production-ready, fully env-driven Centrifugo deployment for Coolify.
# Designed to be deployed as a STANDALONE service (separately from the
# backend/frontend), reachable via a public domain such as:
#   rt.example.com  →  wss://rt.example.com
#
# Why env-driven (no config.json bind mount)?
#   In Coolify's Docker Compose build pack the working directory at runtime
#   is NOT guaranteed to be the repo root, so a relative bind mount like
#   `./deploy/centrifugo/config.json:/centrifugo/config.json:ro` is
#   unreliable — the container starts but Centrifugo logs:
#       "using config file"  →  "config file not found"
#   and then ignores every CENTRIFUGO_* env var that depends on a config
#   namespace. To avoid that entire class of failure, this compose file
#   configures Centrifugo ENTIRELY through environment variables. No
#   volume mount is required and no config file needs to exist in the
#   container.
#
# Why no healthcheck?
#   The official `centrifugo/centrifugo:v5.4.5` image is built FROM scratch
#   and ships NO shell, NO wget, NO curl. It also does NOT expose a
#   `centrifugo healthcheck` subcommand (verified at runtime: `unknown
#   command "healthcheck"`). Every Docker-level healthcheck we could write
#   would therefore fail and Coolify would mark the service `unhealthy`
#   even when it is serving traffic correctly. Coolify's own proxy-level
#   health probe on the public domain is sufficient for liveness.
#
# Coolify deployment settings (must match exactly):
#   Build Pack             : Docker Compose
#   Docker Compose Location: docker-compose.centrifugo.yml   (NO leading slash)
#   Custom Build Command   : (leave empty)
#   Custom Start Command   : (leave empty)
#   Base Directory         : /
#
# Required environment variables (set them in Coolify → this service → Env):
#   CENTRIFUGO_TOKEN_HMAC_SECRET_KEY  – HMAC secret for connection JWTs (HS256)
#                                       Generate with: openssl rand -hex 32
#                                       MUST match the value entered in
#                                       Super Admin → Providers → Realtime
#                                       → "HMAC Token Secret".
#   CENTRIFUGO_API_KEY                – Server-to-server HTTP API key
#                                       Generate with: openssl rand -hex 32
#                                       MUST match Super Admin → Providers →
#                                       Realtime → "API Key".
#   CENTRIFUGO_ALLOWED_ORIGINS        – Comma-separated origins allowed to
#                                       open a WebSocket. In a multi-tenant
#                                       SaaS embed system this MUST be "*"
#                                       so any customer domain can connect
#                                       without a redeploy. Origin authorization
#                                       is enforced by the backend
#                                       (/api/realtime/connect + /subscribe)
#                                       against the per-workspace allow-list
#                                       (workspace_domains + widget_settings.allowed_domains).
#                                       Centrifugo here is a transport layer,
#                                       NOT the authorization layer.
#
# Optional environment variables:
#   CENTRIFUGO_ADMIN                  – "true" to enable the admin UI
#                                       (default: not set / disabled).
#   CENTRIFUGO_ADMIN_PASSWORD         – Required if admin enabled.
#   CENTRIFUGO_ADMIN_SECRET           – Required if admin enabled.
#
# After deploy, in Coolify add a domain (e.g. rt.example.com) pointing to
# port 8000 of this container. Coolify will terminate TLS and proxy both
# HTTP (/api) and WebSocket (/connection/websocket) traffic.

services:
  centrifugo:
    image: centrifugo/centrifugo:v5.4.5
    restart: unless-stopped

    # NOTE: Do NOT publish the port to the host with `ports:`.
    # Coolify's reverse proxy talks to the container over the internal
    # Docker network using the `expose`d port. Publishing 8000:8000 fails
    # on hosts where port 8000 is already in use.
    expose:
      - "8000"

    # Fully env-driven. No config file is read — Centrifugo accepts every
    # supported setting via CENTRIFUGO_* env vars (see
    # https://centrifugal.dev/docs/server/configuration#environment-variables).
    # The channel namespace `ws` is declared via CENTRIFUGO_NAMESPACES (a
    # JSON array) and matches the channel pattern issued by the backend's
    # buildChannelName(workspaceId, conversationId)  →  ws:{ws}:conv:{conv}
    environment:
      # --- Network -------------------------------------------------------
      CENTRIFUGO_ADDRESS: "0.0.0.0"
      CENTRIFUGO_PORT: "8000"

      # --- Auth (REQUIRED) ----------------------------------------------
      # Centrifugo's own runtime variable name. The previous version of
      # this file used CENTRIFUGO_TOKEN_HMAC_SECRET, which Centrifugo
      # rejects with: `unknown key found in the environment`. Use ONLY
      # CENTRIFUGO_TOKEN_HMAC_SECRET_KEY going forward.
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_API_INSECURE: "false"

      # --- Origins (transport-level only) -------------------------------
      # IMPORTANT: In this multi-tenant SaaS, real authorization happens in
      # the backend (/api/realtime/connect + /subscribe) against each
      # workspace's dynamic allow-list (workspace_domains). Centrifugo's
      # static `allowed_origins` cannot scale to arbitrary customer domains
      # without redeploying, so we set it to "*" and rely on the backend
      # gatekeeper. Defaulted to "*" — override only if you want an
      # additional belt-and-suspenders cap at the transport layer.
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-*}

      # --- Channel namespaces -------------------------------------------
      # Declared inline as JSON so the container needs no config file.
      # Matches buildChannelName() in server/services/realtime/types.ts.
      # `vp` = VISITOR PRESENCE shards (vp:{workspace_id}:{shard}).
      # Membership of a shard IS the visitor's live-presence signal, so the
      # backend reads it with the admin API key instead of writing a database
      # heartbeat. `allow_presence_for_client` MUST stay false here: visitors
      # share a shard, and a client-side presence call would let one visitor
      # enumerate the others. History and join/leave are off — the channel
      # carries no payload, only membership.
      CENTRIFUGO_NAMESPACES: >-
        [{"name":"ws","presence":true,"join_leave":true,"force_push_join_leave":false,"history_size":50,"history_ttl":"300s","force_recovery":true,"allow_subscribe_for_client":false,"allow_publish_for_client":false,"allow_presence_for_client":true,"allow_history_for_client":true,"subscribe_for_anonymous":false},{"name":"vp","presence":true,"join_leave":false,"history_size":0,"allow_subscribe_for_client":false,"allow_publish_for_client":false,"allow_presence_for_client":false,"allow_history_for_client":false,"subscribe_for_anonymous":false}]

      # --- Client behaviour ---------------------------------------------
      CENTRIFUGO_CLIENT_ANONYMOUS: "false"
      CENTRIFUGO_CLIENT_CONCURRENCY: "8"
      CENTRIFUGO_CLIENT_CHANNEL_LIMIT: "64"
      CENTRIFUGO_CLIENT_QUEUE_MAX_SIZE: "1048576"
      CENTRIFUGO_CLIENT_STALE_CLOSE_DELAY: "25s"
      CENTRIFUGO_CLIENT_EXPIRED_CLOSE_DELAY: "25s"
      CENTRIFUGO_CLIENT_EXPIRED_SUB_CLOSE_DELAY: "25s"
      CENTRIFUGO_CLIENT_USER_CONNECTION_LIMIT: "0"

      # --- WebSocket transport ------------------------------------------
      CENTRIFUGO_WEBSOCKET_COMPRESSION: "true"
      CENTRIFUGO_WEBSOCKET_PING_INTERVAL: "25s"
      CENTRIFUGO_WEBSOCKET_WRITE_TIMEOUT: "5s"

      # --- Engine --------------------------------------------------------
      # Single-node memory engine is sufficient for this deployment scale.
      # Switch to "redis" + CENTRIFUGO_REDIS_ADDRESS for HA / multi-node.
      CENTRIFUGO_ENGINE: "memory"

      # --- Health & logging ---------------------------------------------
      CENTRIFUGO_HEALTH: "true"
      CENTRIFUGO_LOG_LEVEL: "info"

      # --- Admin UI (OFF by default) ------------------------------------
      # To enable: set CENTRIFUGO_ADMIN=true and provide the two secrets
      # below in Coolify env. Then expose /admin behind your reverse proxy
      # with HTTP basic auth or an IP allowlist.
      CENTRIFUGO_ADMIN: ${CENTRIFUGO_ADMIN:-false}
      CENTRIFUGO_ADMIN_INSECURE: "false"
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-}

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # NOTE: No `healthcheck:` block on purpose. The v5.4.5 image has no
    # shell, no wget/curl, and NO `centrifugo healthcheck` subcommand
    # (running it returns: `unknown command "healthcheck"`). Any healthcheck
    # we add here would always fail and Coolify would mark the container
    # `unhealthy` even though it is serving traffic. Liveness is verified
    # at the Coolify proxy layer via the public domain.

    labels:
      - "coolify.managed=true"
      - "coolify.service=centrifugo"
