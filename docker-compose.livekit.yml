# docker-compose.livekit.yml
#
# Production-ready, env-driven LiveKit deployment for Coolify.
# Deploy as a STANDALONE Coolify service (separate from backend/frontend),
# reachable via a public domain such as wss://livekit.your-domain.tld.
#
# Strategy: env-driven + startup-generated config file
# ----------------------------------------------------
# At container startup, a tiny shell wrapper writes a real YAML file to
# /tmp/livekit.yaml using the environment variables set in Coolify, then
# execs `livekit-server --config /tmp/livekit.yaml`. This avoids:
#   - bind-mount fragility (file-vs-directory races, repo path resolution,
#     Coolify build pack staging quirks)
#   - inline LIVEKIT_CONFIG YAML interpolation problems (especially the
#     `keys:` map, which broke when injected as a single string)
# The compose file remains the single source of truth.
#
# Coolify deployment settings (must match exactly):
#   Build Pack             : Docker Compose
#   Docker Compose Location: docker-compose.livekit.yml   (NO leading slash)
#   Custom Build Command   : (leave empty)
#   Custom Start Command   : (leave empty)
#   Base Directory         : /
#
# Required environment variables (set in Coolify -> this service -> Env):
#   LIVEKIT_API_KEY     - LiveKit API key (identifier).
#                         Generate: openssl rand -hex 16
#                         MUST match Super Admin -> Providers -> Calls -> LiveKit.
#   LIVEKIT_API_SECRET  - LiveKit API secret (signing secret).
#                         Generate: openssl rand -hex 32
#                         MUST match Super Admin -> Providers -> Calls -> LiveKit.
#   LIVEKIT_NODE_IP     - Public IP of the host running this container.
#                         REQUIRED. Without it, LiveKit advertises a Docker
#                         internal IP in ICE candidates and remote browsers
#                         cannot establish media streams.
#                         Find with: curl -s https://api.ipify.org
#
# Optional environment variables:
#   LIVEKIT_LOG_LEVEL          - debug | info | warn | error  (default info)
#   LIVEKIT_WEBHOOK_API_KEY    - same value as LIVEKIT_API_KEY, for webhooks
#   LIVEKIT_REDIS_ADDRESS      - "host:port". Optional for a single standalone
#                                node; required for a multi-node deployment,
#                                where nodes find each other through Redis.
#   LIVEKIT_REDIS_USERNAME     - optional Redis ACL user
#   LIVEKIT_REDIS_PASSWORD     - optional Redis password
#   LIVEKIT_REDIS_DB           - optional Redis database index (default 0)
#   LIVEKIT_TURN_DOMAIN        - reserved for future TURN/TLS rollout
#
# Ports (host firewall must allow):
#   7880/tcp        - Signaling. Coolify proxies wss://<domain>/ -> 7880.
#   7881/tcp        - ICE/TCP fallback for restrictive networks.
#   50000-50100/udp - WebRTC media. UDP bypasses Coolify's HTTP proxy and
#                     goes DIRECTLY to the host. Open this range on the
#                     cloud provider firewall.
#
# Healthcheck:
#   `wget -qO- http://127.0.0.1:7880/ | grep -q OK` runs INSIDE the container
#   against LiveKit's signaling port. The base image is alpine-based and ships
#   with BusyBox `wget`, so no extra tooling is needed. The check is local-only
#   (no DNS, no public domain, no Coolify proxy) so it can't be poisoned by an
#   external outage and won't mask real startup failures — if the YAML render
#   step in the entrypoint aborts, the container still exits and Coolify still
#   shows the restart loop. `start_period: 20s` gives LiveKit enough time to
#   bind 7880 on first boot before the first probe runs.

services:
  livekit:
    # CC-2H — Image tag is configurable via LIVEKIT_IMAGE_TAG.
    # MUST be compatible with the bundled livekit-client UMD shipped at
    # public/call-widget/vendor/livekit-client.umd.min.js. Modern clients
    # call /rtc/v1/validate on connect, so the server (and any reverse
    # proxy in front of it) MUST support the /rtc/v1 path. Older
    # 1.7.x server tags answered /rtc only and return 404 on /rtc/v1,
    # which surfaces as "v1 RTC path not found" in the browser.
    # Default pins a release that supports /rtc/v1.
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-v1.8.4}
    restart: unless-stopped

    # Override the image entrypoint so we can run a tiny shell wrapper that
    # generates the config file from env vars BEFORE launching livekit-server.
    # `exec` replaces the shell with the LiveKit process so signals (SIGTERM
    # from Coolify on redeploy) are delivered correctly and PID 1 stays clean.
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu
        : "$${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}"
        : "$${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
        : "$${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP is required (public IP of this host)}"
        LOG_LEVEL="$${LIVEKIT_LOG_LEVEL:-info}"
        cat > /tmp/livekit.yaml <<EOF
        port: 7880
        log_level: $${LOG_LEVEL}
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          # We provide the public IP explicitly via LIVEKIT_NODE_IP, so disable
          # STUN-based auto-discovery. In LiveKit's config, use_external_ip
          # takes precedence over node_ip; leaving it true can prevent the node
          # from advertising the intended address consistently.
          use_external_ip: false
          node_ip: $${LIVEKIT_NODE_IP}
        keys:
          $${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}
        room:
          auto_create: true
          empty_timeout: 300
          departure_timeout: 20
        EOF
        # Redis is OPTIONAL for a single standalone node and required only for
        # a multi-node deployment. Appending the block only when an address is
        # configured keeps single-node deployments untouched. The variable was
        # documented but inert before: nothing ever wrote it into the config.
        if [ -n "$${LIVEKIT_REDIS_ADDRESS:-}" ]; then
          {
            echo "redis:"
            echo "  address: $${LIVEKIT_REDIS_ADDRESS}"
            if [ -n "$${LIVEKIT_REDIS_USERNAME:-}" ]; then echo "  username: $${LIVEKIT_REDIS_USERNAME}"; fi
            if [ -n "$${LIVEKIT_REDIS_PASSWORD:-}" ]; then echo "  password: $${LIVEKIT_REDIS_PASSWORD}"; fi
            echo "  db: $${LIVEKIT_REDIS_DB:-0}"
          } >> /tmp/livekit.yaml
        fi
        # TURN. Off unless a domain is named, for the same reason Redis is:
        # a relay nobody can reach is worse than none, because the client
        # spends its ICE budget on it. Naming the domain is the operator
        # saying "this hostname resolves to me and a TLS front end or my own
        # certificate is in place" — LiveKit puts it in the credentials it
        # mints, so a name that does not resolve fails every relayed call.
        #
        # LiveKit issues its own per-participant TURN credentials over the
        # signalling connection. Nothing needs to be entered in the app's RTC
        # endpoint settings, and nothing should be: an ICE server pointing
        # here without credentials is a broken route, not a spare one. Tell
        # the backend it exists in Super Admin -> Providers -> Calls ->
        # LiveKit -> TURN domain, which is what stops it reporting that no
        # relay is configured.
        if [ -n "$${LIVEKIT_TURN_DOMAIN:-}" ]; then
          {
            echo "turn:"
            echo "  enabled: true"
            echo "  domain: $${LIVEKIT_TURN_DOMAIN}"
            echo "  udp_port: $${LIVEKIT_TURN_UDP_PORT:-3478}"
            echo "  tls_port: $${LIVEKIT_TURN_TLS_PORT:-5349}"
            # Two ways to get TLS onto the TLS port, and exactly one of them
            # must be true. With a certificate, LiveKit terminates it itself.
            # Without, something in front must be doing it — on Coolify that
            # is Traefik, via a TCP router matching this hostname by SNI (see
            # the labels at the bottom of this file). external_tls tells
            # LiveKit which of the two it is; getting it wrong gives a port
            # that speaks the wrong protocol and fails only on the networks
            # TURN exists to rescue, which is the worst place to find out.
            if [ -n "$${LIVEKIT_TURN_CERT_FILE:-}" ] && [ -n "$${LIVEKIT_TURN_KEY_FILE:-}" ]; then
              echo "  cert_file: $${LIVEKIT_TURN_CERT_FILE}"
              echo "  key_file: $${LIVEKIT_TURN_KEY_FILE}"
              echo "  external_tls: false"
            else
              echo "  external_tls: $${LIVEKIT_TURN_EXTERNAL_TLS:-true}"
            fi
            # Pinned next to the media range rather than left at LiveKit's
            # 30000-40000 default, so the ports a relay allocates are a set
            # this file publishes and an operator can find in a firewall.
            echo "  relay_range_start: $${LIVEKIT_TURN_RELAY_PORT_START:-50101}"
            echo "  relay_range_end: $${LIVEKIT_TURN_RELAY_PORT_END:-50200}"
          } >> /tmp/livekit.yaml
        fi
        echo "[livekit-bootstrap] generated /tmp/livekit.yaml (log_level=$${LOG_LEVEL}, node_ip=$${LIVEKIT_NODE_IP}, redis=$${LIVEKIT_REDIS_ADDRESS:-none}, turn=$${LIVEKIT_TURN_DOMAIN:-off})"
        exec /livekit-server --config /tmp/livekit.yaml

    # Signaling reaches LiveKit via Coolify's reverse proxy on the internal
    # Docker network -> `expose`. Media ports MUST be published to the host
    # because WebRTC traffic does NOT traverse Coolify's HTTP proxy.
    expose:
      - "7880"
      # Reachable to the proxy over the Docker network, never to the host.
      - "${LIVEKIT_TURN_TLS_PORT:-5349}"
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
      # TURN's UDP side, which cannot go through an HTTP proxy and so must
      # reach the host directly. Published unconditionally — compose cannot
      # make a port conditional — and inert until LIVEKIT_TURN_DOMAIN is
      # set. Check both are free before the first deploy: a port already in
      # use fails the whole stack, not just TURN.
      - "${LIVEKIT_TURN_UDP_PORT:-3478}:${LIVEKIT_TURN_UDP_PORT:-3478}/udp"
      - "${LIVEKIT_TURN_RELAY_PORT_START:-50101}-${LIVEKIT_TURN_RELAY_PORT_END:-50200}:${LIVEKIT_TURN_RELAY_PORT_START:-50101}-${LIVEKIT_TURN_RELAY_PORT_END:-50200}/udp"
      #
      # The TLS port is deliberately NOT here. In the mode that is worth
      # having, the proxy in front terminates TLS on 443 and reaches this
      # container over the Docker network, so the port needs exposing, not
      # publishing — and LIVEKIT_TURN_TLS_PORT=443 (what LiveKit advertises
      # AND listens on inside its own namespace) would collide with the
      # proxy's own 443 the moment it were published, and take the whole
      # stack down on deploy. If instead LiveKit holds its own certificate
      # (LIVEKIT_TURN_CERT_FILE) and nothing fronts it, add the mapping
      # back here as "5349:5349/tcp".

    environment:
      # --- Required: consumed by the startup wrapper above ---------------
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP}
      LIVEKIT_LOG_LEVEL: ${LIVEKIT_LOG_LEVEL:-info}

      # --- Optional: webhook signing (only if used) ---------------------
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_WEBHOOK_API_KEY:-}

      # --- Redis: multi-node only, optional for a single node -------------
      LIVEKIT_REDIS_ADDRESS: ${LIVEKIT_REDIS_ADDRESS:-}
      LIVEKIT_REDIS_USERNAME: ${LIVEKIT_REDIS_USERNAME:-}
      LIVEKIT_REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD:-}
      LIVEKIT_REDIS_DB: ${LIVEKIT_REDIS_DB:-0}

      # --- Optional: TURN. Empty domain = off -----------------------------
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-}
      LIVEKIT_TURN_UDP_PORT: ${LIVEKIT_TURN_UDP_PORT:-3478}
      LIVEKIT_TURN_TLS_PORT: ${LIVEKIT_TURN_TLS_PORT:-5349}
      LIVEKIT_TURN_EXTERNAL_TLS: ${LIVEKIT_TURN_EXTERNAL_TLS:-true}
      LIVEKIT_TURN_CERT_FILE: ${LIVEKIT_TURN_CERT_FILE:-}
      LIVEKIT_TURN_KEY_FILE: ${LIVEKIT_TURN_KEY_FILE:-}
      LIVEKIT_TURN_RELAY_PORT_START: ${LIVEKIT_TURN_RELAY_PORT_START:-50101}
      LIVEKIT_TURN_RELAY_PORT_END: ${LIVEKIT_TURN_RELAY_PORT_END:-50200}

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # Local-only healthcheck. The LiveKit signaling endpoint returns the
    # literal body "OK" on `GET /` once the server is listening on 7880.
    # `wget` is provided by BusyBox in the alpine-based LiveKit image, so no
    # extra tooling is required. Probing 127.0.0.1 keeps the check entirely
    # inside the container — it doesn't depend on Coolify's reverse proxy,
    # DNS, or the public domain, so a transient external outage cannot flip
    # the container to "unhealthy". `start_period: 20s` covers first-boot
    # config render + listener bind so the very first probe doesn't fail.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      - "coolify.managed=true"
      - "coolify.service=livekit"
      # Harden Coolify/Traefik routing for Docker Compose stacks: explicitly
      # tell the proxy which internal port serves HTTP signaling. Without an
      # explicit load-balancer port, some Coolify versions can produce a public
      # `503 no available server` even while the container itself is running.
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
      #
      # TURN over TLS, shared onto the proxy's own 443 by a TCP router that
      # matches by SNI and hands the decrypted stream to LiveKit. 443 is the
      # port a locked-down network allows, and therefore the only one that
      # rescues the visitors TURN exists for.
      #
      # The hostname is read from the environment, never written here — it
      # belongs to a deployment, not to this repository. Set, together:
      #
      #   LIVEKIT_TURN_DOMAIN=turn.your-domain.tld
      #   LIVEKIT_TURN_CERTRESOLVER=letsencrypt   # Coolify's resolver name
      #   LIVEKIT_TURN_TLS_PORT=443
      #   LIVEKIT_TURN_EXTERNAL_TLS=true
      #
      # LIVEKIT_TURN_TLS_PORT is deliberately one variable doing two jobs:
      # it is the port LiveKit ADVERTISES in the credentials it mints, and
      # the port it listens on inside its own namespace, which is where the
      # router below forwards. They cannot disagree if they are the same
      # value. Inside the container nothing else holds 443.
      #
      # With TURN off both variables are empty, and then this router matches
      # a name that cannot exist and asks for no certificate — `.invalid` is
      # reserved precisely so it can never resolve, and an empty resolver is
      # what keeps ACME quiet about it. That is why the default is a
      # placeholder rather than the domain variable alone: an empty HostSNI
      # is a parse error, and a broken router in a shared proxy is a worse
      # failure than no TURN.
      - "traefik.tcp.routers.livekit-turn.rule=HostSNI(`${LIVEKIT_TURN_DOMAIN:-turn.invalid}`)"
      - "traefik.tcp.routers.livekit-turn.entrypoints=${LIVEKIT_TURN_ENTRYPOINT:-https}"
      - "traefik.tcp.routers.livekit-turn.tls=true"
      - "traefik.tcp.routers.livekit-turn.tls.certresolver=${LIVEKIT_TURN_CERTRESOLVER:-}"
      - "traefik.tcp.routers.livekit-turn.service=livekit-turn"
      - "traefik.tcp.services.livekit-turn.loadbalancer.server.port=${LIVEKIT_TURN_TLS_PORT:-5349}"
