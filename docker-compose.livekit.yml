# docker-compose.livekit.yml
#
# Production-ready, env-driven LiveKit deployment for Coolify.
# Deploy as a STANDALONE Coolify service (separate from backend/frontend),
# reachable via a public domain such as wss://livekit.your-domain.tld.
#
# Why this shape?
#   LiveKit's full server config is passed as a single YAML blob via the
#   LIVEKIT_CONFIG environment variable. This avoids ALL bind-mount
#   fragility (file-vs-directory races, repo-relative path issues, Coolify
#   build pack staging quirks) that plagued the previous file-mount setup.
#   The compose file becomes the single source of truth.
#
# Coolify deployment settings (must match exactly):
#   Build Pack             : Docker Compose
#   Docker Compose Location: docker-compose.livekit.yml   (NO leading slash)
#   Custom Build Command   : (leave empty)
#   Custom Start Command   : (leave empty)
#   Base Directory         : /
#
# Required environment variables (set in Coolify -> this service -> Env):
#   LIVEKIT_API_KEY     - LiveKit API key (identifier).
#                         Generate: openssl rand -hex 16
#                         MUST match Super Admin -> Providers -> Calls -> LiveKit.
#   LIVEKIT_API_SECRET  - LiveKit API secret (signing secret).
#                         Generate: openssl rand -hex 32
#                         MUST match Super Admin -> Providers -> Calls -> LiveKit.
#   LIVEKIT_NODE_IP  - Public IP of the host running this container.
#                      REQUIRED. Without it, LiveKit advertises a Docker
#                      internal IP in ICE candidates and remote browsers
#                      cannot establish media streams.
#                      Find with: curl -s https://api.ipify.org
#
# Optional environment variables:
#   LIVEKIT_LOG_LEVEL          - debug | info | warn | error  (default info)
#   LIVEKIT_WEBHOOK_API_KEY    - same value as LIVEKIT_API_KEY, for webhooks
#   LIVEKIT_REDIS_ADDRESS      - "host:port", multi-node only
#   LIVEKIT_TURN_DOMAIN        - reserved for future TURN/TLS rollout
#
# Ports (host firewall must allow):
#   7880/tcp        - Signaling. Coolify proxies wss://<domain>/ -> 7880.
#   7881/tcp        - ICE/TCP fallback for restrictive networks.
#   50000-50100/udp - WebRTC media. UDP bypasses Coolify's HTTP proxy and
#                     goes DIRECTLY to the host. Open this range on the
#                     cloud provider firewall.

services:
  livekit:
    image: livekit/livekit-server:v1.7.2
    restart: unless-stopped

    # Signaling reaches LiveKit via Coolify's reverse proxy on the internal
    # Docker network -> `expose`. Media ports MUST be published to the host
    # because WebRTC traffic does NOT traverse Coolify's HTTP proxy.
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"

    environment:
      # --- Full server config as a single YAML blob ---------------------
      # LiveKit reads its entire configuration from this env var when set,
      # so no /etc/livekit/livekit.yaml file is needed. Secrets and the
      # advertised public IP are interpolated from sibling env vars below.
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
          node_ip: ${LIVEKIT_NODE_IP}
        keys:
          ${LIVEKIT_KEYS}
        room:
          auto_create: true
          empty_timeout: 300
          departure_timeout: 20

      # --- Sibling env vars referenced inside LIVEKIT_CONFIG ------------
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP}
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
      LIVEKIT_LOG_LEVEL: ${LIVEKIT_LOG_LEVEL:-info}

      # --- Optional: webhook signing (only if used) ---------------------
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_WEBHOOK_API_KEY:-}

      # --- Optional: multi-node Redis (leave unset for single-node) -----
      LIVEKIT_REDIS_ADDRESS: ${LIVEKIT_REDIS_ADDRESS:-}

      # --- Optional: reserved for future TURN/TLS rollout ---------------
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-}

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    labels:
      - "coolify.managed=true"
      - "coolify.service=livekit"
