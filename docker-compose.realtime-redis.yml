# ─────────────────────────────────────────────────────────────────────
#  Realtime Redis — coordination engine for multi-node Centrifugo.
#
#  This Redis exists ONLY for Centrifugo's engine (cross-node publish,
#  presence, history). The application backend never talks to it.
#
#  Deploy as its own Coolify resource, then attach the Centrifugo nodes
#  (docker-compose.centrifugo-redis.yml) to the same network.
#
#  Required environment (Coolify → Environment Variables, secret):
#    REALTIME_REDIS_PASSWORD   strong random password
#  Optional:
#    REALTIME_REDIS_MAXMEMORY        memory ceiling (default 512mb)
#    REALTIME_REDIS_MAXMEMORY_POLICY default noeviction — see the note below
#
#  This Redis is NEVER published on the host or on a public domain: the
#  Centrifugo nodes reach it over the internal `realtime` network only.
# ─────────────────────────────────────────────────────────────────────
services:
  realtime-redis:
    # Pinned — do not float this tag.
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REALTIME_REDIS_PASSWORD:?REALTIME_REDIS_PASSWORD is required}
      # Realtime coordination state is ephemeral by design: presence and
      # history are rebuilt from live connections after a restart, and
      # PostgreSQL remains the source of truth for all business data.
      # Persistence is therefore disabled to avoid fork/IO stalls.
      - --save
      - ""
      - --appendonly
      - "no"
      # Memory policy — noeviction, deliberately.
      #
      # This Redis holds Centrifugo's OPERATIONAL state: pub/sub fan-out,
      # presence hashes and channel history for recovery. Under memory
      # pressure `allkeys-lru` would silently evict those keys, and the
      # visible symptom would be WRONG presence in the operator UI and
      # missed history recovery — a correctness failure that looks like an
      # application bug. `noeviction` instead makes Centrifugo's own writes
      # fail loudly, which surfaces as node health/degradation and is
      # observable. maxmemory therefore MUST be monitored/alerted
      # (Centrifugo Prometheus + the platform's realtime alerts).
      #
      # allkeys-lru would only be defensible with a documented load test
      # proving presence/history correctness under eviction for the pinned
      # Centrifugo version. No such test exists, so it is not the default.
      - --maxmemory
      - ${REALTIME_REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - ${REALTIME_REDIS_MAXMEMORY_POLICY:-noeviction}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REALTIME_REDIS_PASSWORD}
    networks:
      - realtime

networks:
  realtime:
    name: ${REALTIME_NETWORK:-realtime}
    external: false
