# docker-compose.yml — LOCAL DEVELOPMENT ONLY
# For production: deploy frontend and backend as separate services in Coolify.
# See COOLIFY_DEPLOY.md for production instructions.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        # Stamped into the image so /internal/channels/ready no longer
        # reports build=unknown — lets the Channels Worker prove whether a
        # 404 means a stale Core container vs. a real route regression.
        APP_VERSION: ${APP_VERSION:-local-dev}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      # ── Plugin Platform / Channels (Telegram) ──────────────────────
      # Core needs all four to connect a bot and to serve the internal API.
      - PLUGIN_SECRETS_MASTER_KEY=${PLUGIN_SECRETS_MASTER_KEY:-}
      - CHANNELS_WEBHOOK_SIGNING_KEY=${CHANNELS_WEBHOOK_SIGNING_KEY:-}
      - CORE_INTERNAL_SECRET=${CORE_INTERNAL_SECRET:-}
      # Public HTTPS origin of the channels-gateway service (what Telegram calls).
      - PUBLIC_CHANNELS_BASE_URL=${PUBLIC_CHANNELS_BASE_URL:-}
      - CHANNELS_INTERNAL_BASE_URL=${CHANNELS_INTERNAL_BASE_URL:-http://channels-gateway:3011}
      # Centrifugo bootstrap defaults (optional — admin can also configure via UI).
      # When set, the backend can pre-populate the realtime provider config on first run.
      - CENTRIFUGO_WS_URL=${CENTRIFUGO_WS_URL:-ws://localhost:8000/connection/websocket}
      - CENTRIFUGO_API_URL=${CENTRIFUGO_API_URL:-http://centrifugo:8000/api}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-}
      - CENTRIFUGO_TOKEN_HMAC_SECRET=${CENTRIFUGO_TOKEN_HMAC_SECRET:-}
      # ── AI Provider Isolation ──────────────────────────────────────
      # Core NEVER calls an AI provider directly; every completion, test
      # and embedding goes through the AI Runtime. In production this URL
      # points at the external server (https://ai-runtime.example.com).
      - AI_RUNTIME_URL=${AI_RUNTIME_URL:-http://ai-runtime:3021}
      - AI_RUNTIME_INTERNAL_SECRET=${AI_RUNTIME_INTERNAL_SECRET:-}
    volumes:
      # Persistent GeoIP data volume. The backend reads the .mmdb file from
      # /app/data (configured in Super Admin → Map & Geo) and the optional
      # auto-updater writes into the same directory atomically.
      - geoip-data:/app/data
    restart: unless-stopped
    depends_on:
      - centrifugo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # Centrifugo — realtime provider (Phase 3, global only).
  # Configured via env vars; HMAC token signing shared with backend.
  # ─────────────────────────────────────────────────────────────────
  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo --client_insecure=false --admin
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
    environment:
      # Token signing — MUST match backend CENTRIFUGO_TOKEN_HMAC_SECRET.
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_TOKEN_HMAC_SECRET:-please-change-me-shared-with-backend}
      # Server-to-server admin API key — MUST match backend CENTRIFUGO_API_KEY.
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-please-change-me-admin-api-key}
      - CENTRIFUGO_ADMIN=true
      - CENTRIFUGO_ADMIN_PASSWORD=${CENTRIFUGO_ADMIN_PASSWORD:-changeme}
      - CENTRIFUGO_ADMIN_SECRET=${CENTRIFUGO_ADMIN_SECRET:-changeme-admin-secret}
      - CENTRIFUGO_ALLOWED_ORIGINS=${CENTRIFUGO_ALLOWED_ORIGINS:-*}
      - CENTRIFUGO_PRESENCE=true
      - CENTRIFUGO_HISTORY_SIZE=50
      - CENTRIFUGO_HISTORY_TTL=300s
      - CENTRIFUGO_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # Channels Gateway — public webhook ingress for Telegram.
  # PUBLIC_CHANNELS_BASE_URL must resolve to THIS service over HTTPS.
  # Holds no database access and no credentials by design.
  # ─────────────────────────────────────────────────────────────────
  channels-gateway:
    build:
      context: .
      dockerfile: Dockerfile.channels
    ports:
      - "${CHANNELS_PORT:-3011}:3011"
    environment:
      - CHANNELS_PORT=3011
      - CHANNELS_WEBHOOK_SIGNING_KEY=${CHANNELS_WEBHOOK_SIGNING_KEY:-}
      - CORE_INTERNAL_SECRET=${CORE_INTERNAL_SECRET:-}
      - CORE_INTERNAL_BASE_URL=${CORE_INTERNAL_BASE_URL:-http://backend:3001}
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3011/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────
  # Channels Worker — drains channel_jobs (inbound + outbound delivery).
  # Without it, messages are queued but never delivered.
  # ─────────────────────────────────────────────────────────────────
  channels-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_KIND=channels
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CORE_INTERNAL_BASE_URL=${CORE_INTERNAL_BASE_URL:-http://backend:3001}
      - CORE_INTERNAL_SECRET=${CORE_INTERNAL_SECRET:-}
      - PLUGIN_SECRETS_MASTER_KEY=${PLUGIN_SECRETS_MASTER_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend

  # ─────────────────────────────────────────────────────────────────
  # AI Runtime — the ONLY service permitted to reach AI providers.
  # In the split topology this container runs on the EXTERNAL server
  # while backend/DB/frontend stay in the restricted network; here it
  # runs locally so dev matches production wiring.
  # Stateless: no Supabase credentials, no stored provider keys.
  # ─────────────────────────────────────────────────────────────────
  ai-runtime:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "${AI_RUNTIME_PORT:-3021}:3021"
    environment:
      - AI_RUNTIME_PORT=3021
      - AI_RUNTIME_INTERNAL_SECRET=${AI_RUNTIME_INTERNAL_SECRET:-}
      - AI_HTTP_TIMEOUT_MS=${AI_HTTP_TIMEOUT_MS:-}
      - AI_RETRY_ATTEMPTS=${AI_RETRY_ATTEMPTS:-}
      - AI_TOTAL_BUDGET_MS=${AI_TOTAL_BUDGET_MS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3021/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  geoip-data:
