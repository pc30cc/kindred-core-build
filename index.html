<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title></title>
    <meta name="description" content="" />

    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <script>
      // Restore the last known branded title (from platform_branding_localized)
      // so the first paint does not flash a placeholder.
      (function () {
        try {
          var l = localStorage.getItem('gs_locale') || document.documentElement.lang || 'en';
          var t = localStorage.getItem('gs_title:' + l) || localStorage.getItem('gs_title:en');
          if (t) document.title = t;
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root" style="opacity:0"></div>
    <script type="text/javascript">
      (function () {
        if (window.location.pathname !== '/auth/login') return;
        window.__gs = window.__gs || [];
        var d = document;
        var s = d.createElement('script');
        var apiBase = '%VITE_API_BASE_URL%';
        var loaderBase = '%VITE_WIDGET_LOADER_BASE_URL%';
        var assetBase = '%VITE_WIDGET_ASSET_BASE_URL%';
        var widgetLoaderVersion = '2026-04-18-build-8-shell-handoff';
        // Multi-domain safe: require an explicitly configured loader base.
        // window.location.origin would silently break setups where the panel
        // and widget assets live on different hosts. If the env var is not
        // injected at build time, skip the preview snippet entirely.
        if (!loaderBase || loaderBase.indexOf('%VITE_') === 0) return;
        var loaderClean = loaderBase.replace(/\/+$/, '');
        s.src = loaderClean + '/widget/loader.js?v=' + encodeURIComponent(widgetLoaderVersion);
        s.async = 1;
        var assetClean = (assetBase && assetBase.indexOf('%VITE_') !== 0)
          ? assetBase.replace(/\/+$/, '')
          : loaderClean;
        s.setAttribute('data-asset-base', assetClean);
        if (apiBase && apiBase.indexOf('%VITE_') !== 0) {
          s.setAttribute('data-api-base', apiBase.replace(/\/$/, ''));
        }
        d.getElementsByTagName('head')[0].appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
