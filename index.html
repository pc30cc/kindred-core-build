<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- iOS Safari ignores the manifest when adding to the home screen and
         reads this instead. Square and opaque on purpose: iOS applies its own
         corner mask, so a rounded one comes out rounded twice. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Default PWA head tags, present before hydration; PlatformBrandingGate
         (src/features/branding/PlatformBrandingGate.tsx) overwrites these
         live once platform_branding loads (locale-correct manifest URL,
         branded theme color/icon), and removes them entirely on native
         (Capacitor) or when an operator disables PWA in Super Admin. -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title></title>
    <meta name="description" content="" />

    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <script>
      // Restore the last known branded title (from platform_branding_localized)
      // so the first paint does not flash a placeholder.
      (function () {
        try {
          var l = localStorage.getItem('app-locale') || document.documentElement.lang || 'en';
          var t = localStorage.getItem('gs_title:' + l) || localStorage.getItem('gs_title:en');
          if (t) document.title = t;
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />

    <!-- Runtime deployment config (editable without rebuilding the bundle). -->
    <script src="/runtime-config.js"></script>
    <!-- The platform's edition and brand for a browser that has never seen
         this platform (server/routes/platformPublic.ts, GET
         /api/platform/public/boot.js). Loaded ASYNCHRONOUSLY: nothing waits
         for the API — the page and the bundle start at once. A browser that
         has seen the platform keeps its cache (src/lib/edition.ts
         `wy-edition`, src/lib/brand.ts `wy-brand`) and asks for nothing.
         While a first visit waits (at most BOOT_TIMEOUT_MS) the splash keeps
         its brand area empty (`wy-boot-pending`), so neither brand flashes;
         the answer then dresses it (the International kit, or WebYar's as
         always), and a failure or a timeout shows today's default splash. -->
    <style>
      html.wy-boot-pending #boot-splash > * { visibility: hidden; }
    </style>
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 1500;
        var root = document.documentElement;
        // Keep what boot.js said, under the keys the app and the splash read:
        // the edition, the region, the brand, the default language and the
        // browser title per language.
        function remember(b) {
          try {
            if (!b || (b.edition !== 'iran' && b.edition !== 'international')) return false;
            var ls = window.localStorage;
            ls.setItem('wy-edition', b.edition);
            if (typeof b.regionMode === 'string') ls.setItem('platform-region-mode', b.regionMode);
            ls.setItem('wy-brand', JSON.stringify({ names: b.names || {}, siteUrl: b.siteUrl || null, supportEmail: b.supportEmail || null }));
            if (typeof b.defaultLocale === 'string') ls.setItem('wy-default-locale', b.defaultLocale);
            var titles = b.titles || {};
            for (var k in titles) {
              if (Object.prototype.hasOwnProperty.call(titles, k) && !ls.getItem('gs_title:' + k)) ls.setItem('gs_title:' + k, titles[k]);
            }
            if (!document.title) {
              var l = ls.getItem('app-locale') || (b.edition === 'international' && b.defaultLocale) || root.lang || 'en';
              var t = ls.getItem('gs_title:' + l) || ls.getItem('gs_title:en');
              if (t) document.title = t;
            }
            return true;
          } catch (e) { return false; }
        }
        try {
          var ls = window.localStorage;
          var known = ls.getItem('wy-edition');
          if (known === 'iran' || known === 'international') return;
          if (ls.getItem('platform-region-mode') === 'iran' || ls.getItem('wy-site-mode') === 'multi_language') return;
          var cfg = window.__APP_RUNTIME_CONFIG__ || {};
          var base = (typeof cfg.apiBaseUrl === 'string' && cfg.apiBaseUrl.trim()) || '%VITE_API_BASE_URL%';
          if (!base || base.indexOf('%VITE_') === 0) base = '';
          root.className += ' wy-boot-pending';
          var settled = false;
          var timer = null;
          // Once: dress the splash from the answer (if any) and show it.
          var settle = function () {
            if (settled) return;
            settled = true;
            if (timer) clearTimeout(timer);
            remember(window.__PLATFORM_BOOT__);
            try { if (window.__wyApplySplash) window.__wyApplySplash(); } catch (e) {}
            root.className = root.className.replace(/(^|\s)wy-boot-pending(?=\s|$)/g, ' ').replace(/\s+$/, '');
          };
          var s = document.createElement('script');
          s.async = true;
          s.src = base.replace(/\/+$/, '') + '/api/platform/public/boot.js';
          // A late answer (after the timeout) is still kept for the next
          // visit and the app, but no longer changes the splash on show.
          s.onload = function () { if (settled) remember(window.__PLATFORM_BOOT__); else settle(); };
          s.onerror = settle;
          timer = setTimeout(settle, BOOT_TIMEOUT_MS);
          (document.head || root).appendChild(s);
        } catch (e) {
          root.className = root.className.replace(/(^|\s)wy-boot-pending(?=\s|$)/g, ' ');
        }
      })();
    </script>
    <!-- The app's first request (the session check) goes to the API. When the
         API is on another origin (api.<domain>), open that connection now,
         while the app's scripts download, rather than after them. No
         `crossorigin`: the API is called with credentials, which use the
         browser's credentialed connection pool. The build adds font and
         locale preloads after this (vite.config.ts, bootHints). -->
    <script>
      (function () {
        try {
          var cfg = window.__APP_RUNTIME_CONFIG__ || {};
          var base = (typeof cfg.apiBaseUrl === 'string' && cfg.apiBaseUrl.trim()) || '%VITE_API_BASE_URL%';
          if (!base || base.indexOf('%VITE_') === 0) return;
          var origin = new URL(base, location.href).origin;
          if (origin === location.origin) return;
          var link = document.createElement('link');
          link.rel = 'preconnect';
          link.href = origin;
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>


    <meta name="twitter:card" content="summary_large_image" />
    <!-- The launch loader, the same one the iOS app opens on
         (ios/Webyar/Sources/App/WebyarApp.swift, LaunchView): two arcs
         turning against each other and "WEBYAR AI" at the foot. Styled here,
         not in the bundle, so the static #boot-splash below is drawn on the
         first paint; BrandLoaderScreen reuses the same classes. -->
    <style>
      .wy-launch {
        --wy-bg: #f4f6f9; --wy-brand: 59 122 242; --wy-label: rgba(60, 60, 67, 0.6);
        --wy-deep: #0c50e9; --wy-cyan: #2ed6ff;
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; align-items: center; justify-content: center;
        background: var(--wy-bg);
      }
      .wy-launch.wy-inline { position: relative; inset: auto; z-index: auto; min-height: 100vh; min-height: 100dvh; }
      @media (prefers-color-scheme: dark) {
        html:not(.light) .wy-launch { --wy-bg: #0c0e14; --wy-brand: 90 148 255; --wy-label: rgba(235, 235, 245, 0.6); }
      }
      html.dark .wy-launch { --wy-bg: #0c0e14; --wy-brand: 90 148 255; --wy-label: rgba(235, 235, 245, 0.6); }
      html.light .wy-launch { --wy-bg: #f4f6f9; --wy-brand: 59 122 242; --wy-label: rgba(60, 60, 67, 0.6); }
      .wy-loader { position: relative; width: 42.5px; height: 42.5px; direction: ltr; }
      .wy-loader > span { position: absolute; border-radius: 50%; }
      .wy-track { inset: 0; border: 2.5px solid rgb(var(--wy-brand) / 0.10); }
      .wy-comet { inset: 0; transform: rotate(0deg); animation: wy-cw 1s linear infinite; }
      .wy-comet::before {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, rgb(12 80 233 / 0) 0deg, var(--wy-deep) 63.36deg, var(--wy-cyan) 115.2deg, transparent 115.2deg);
        -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
        mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
      }
      .wy-comet::after {
        content: ''; position: absolute; left: 50%; top: 50%; width: 4.75px; height: 4.75px; margin: -2.375px;
        border-radius: 50%; background: var(--wy-cyan); box-shadow: 0 0 6px rgb(46 214 255 / 0.9);
        transform: rotate(115.2deg) translateY(-20px);
      }
      .wy-inner { left: 8.25px; top: 8.25px; width: 26px; height: 26px; transform: rotate(180deg); animation: wy-ccw 1.6s linear infinite; }
      .wy-inner svg { display: block; width: 26px; height: 26px; }
      @keyframes wy-cw { to { transform: rotate(360deg); } }
      @keyframes wy-ccw { from { transform: rotate(180deg); } to { transform: rotate(-180deg); } }
      @media (prefers-reduced-motion: reduce) { .wy-comet, .wy-inner { animation: none; } }
      .wy-footer {
        position: absolute; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        display: flex; justify-content: center; gap: 4.8px; direction: ltr; pointer-events: none;
        font: 600 12px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 3px; padding-left: 3px;
      }
      .wy-footer .wy-name { color: var(--wy-label); }
      .wy-footer .wy-ai {
        background: linear-gradient(90deg, var(--wy-deep), var(--wy-cyan));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #boot-splash { transition: opacity 0.2s ease; }
      /* International mode (src/lib/internationalMode.ts; never in Persian):
         the RESPOK kit's Paper / Ink, the arcs in Signal and its horizontal
         logo at the foot ("color" on light, "reversed" on dark). */
      .wy-loader.wy-intl { --wy-deep: #D3361A; --wy-cyan: #FF5A3C; --wy-brand: 255 90 60; }
      .wy-intl .wy-comet::after { box-shadow: 0 0 6px rgb(255 90 60 / 0.9); }
      .wy-intl .wy-inner circle { stroke: #FF5A3C; }
      .wy-launch:has(> .wy-intl) { --wy-bg: #F5F5F8; }
      .wy-intl-footer img { display: block; height: 22px; width: auto; }
      .wy-intl-footer .wy-intl-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        html:not(.light) .wy-launch:has(> .wy-intl) { --wy-bg: #0E0D1C; }
        html:not(.light) .wy-intl-footer .wy-intl-light { display: none; }
        html:not(.light) .wy-intl-footer .wy-intl-dark { display: block; }
      }
      html.dark .wy-launch:has(> .wy-intl) { --wy-bg: #0E0D1C; }
      html.dark .wy-intl-footer .wy-intl-light { display: none; }
      html.dark .wy-intl-footer .wy-intl-dark { display: block; }
      html.light .wy-launch:has(> .wy-intl) { --wy-bg: #F5F5F8; }
      html.light .wy-intl-footer .wy-intl-light { display: block; }
      html.light .wy-intl-footer .wy-intl-dark { display: none; }
      /* The Iranian edition (WebYar, platform_settings.region_mode = 'iran';
         shared/webyarBrand.ts), once it is known: the brand kit's loader —
         the bubble whose three dots arrive one by one, right to left, and
         leave together (2.6 s) — on the kit's paper / ink, and the Persian
         logotype at the foot ("color" on light, "on-dark" on dark). Never
         in any other region mode, nor before the edition is known. */
      .wy-kit-loader { display: block; width: 64px; height: 64px; }
      .wy-kit-loader .wy-kit-body { fill: #16C7A8; }
      .wy-kit-loader .wy-kit-dot { fill: #FFFFFF; transform-box: fill-box; transform-origin: 50% 50%; animation: 2.6s infinite both; opacity: 0; }
      .wy-kit-loader .wy-kit-d1 { animation-name: wyKitLd1; }
      .wy-kit-loader .wy-kit-d2 { animation-name: wyKitLd2; }
      .wy-kit-loader .wy-kit-d3 { animation-name: wyKitLd3; }
      @keyframes wyKitLd1 { 0%, 7.69% { opacity: 0; transform: scale(0.4); animation-timing-function: cubic-bezier(0.3, 1.45, 0.5, 1); } 19.87% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); } 86.54%, 100% { opacity: 0; transform: scale(0.6); } }
      @keyframes wyKitLd2 { 0%, 23.08% { opacity: 0; transform: scale(0.4); animation-timing-function: cubic-bezier(0.3, 1.45, 0.5, 1); } 35.26% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); } 86.54%, 100% { opacity: 0; transform: scale(0.6); } }
      @keyframes wyKitLd3 { 0%, 38.46% { opacity: 0; transform: scale(0.4); animation-timing-function: cubic-bezier(0.3, 1.45, 0.5, 1); } 50.64% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); } 86.54%, 100% { opacity: 0; transform: scale(0.6); } }
      @media (prefers-reduced-motion: reduce) { .wy-kit-loader .wy-kit-dot { animation: none; opacity: 1; } }
      .wy-launch:has(> .wy-kit-loader) { --wy-bg: #F4F6F8; }
      .wy-kit-footer img { display: block; height: 32px; width: auto; }
      .wy-kit-footer .wy-kit-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        html:not(.light) .wy-launch:has(> .wy-kit-loader) { --wy-bg: #12141F; }
        html:not(.light) .wy-kit-footer .wy-kit-light { display: none; }
        html:not(.light) .wy-kit-footer .wy-kit-dark { display: block; }
      }
      html.dark .wy-launch:has(> .wy-kit-loader) { --wy-bg: #12141F; }
      html.dark .wy-kit-footer .wy-kit-light { display: none; }
      html.dark .wy-kit-footer .wy-kit-dark { display: block; }
      html.light .wy-launch:has(> .wy-kit-loader) { --wy-bg: #F4F6F8; }
      html.light .wy-kit-footer .wy-kit-light { display: block; }
      html.light .wy-kit-footer .wy-kit-dark { display: none; }
    </style>
  </head>

  <body>
    <div id="boot-splash" class="wy-launch" role="status" aria-label="WEBYAR AI">
      <div class="wy-loader" aria-hidden="true">
        <span class="wy-track"></span>
        <span class="wy-comet"></span>
        <span class="wy-inner"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="none" stroke="#2ed6ff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-dasharray="16.59 100" transform="rotate(-90 13 13)" /></svg></span>
      </div>
      <div class="wy-footer" aria-hidden="true"><span class="wy-name">WEBYAR</span><span class="wy-ai">AI</span></div>
    </div>
    <script>
      // International mode (src/lib/internationalMode.ts): the edition last
      // seen (src/lib/edition.ts, key wy-edition) is the International one —
      // in every UI language, Persian included. Then the first paint already
      // wears the RESPOK kit: the launch loader as BrandLoaderScreen draws it,
      // the favicon and the home-screen icon (PlatformBrandingGate keeps them
      // in step afterwards). The Iranian edition wears WebYar's own kit
      // (applyWebyarKit below); an edition not known yet keeps the page as it
      // is. Before wy-edition was written, a cached
      // 'iran' region mode means Iran and a cached multi-language site mode
      // means International (as cachedEdition() reads them).
      // Called again by the head script when a first visit's boot data
      // arrives after this point.
      // The Iranian edition (shared/webyarBrand.ts WEBYAR_BRAND; keep the
      // paths in step): the WebYar brand kit's loader, Persian logotype,
      // favicon, home-screen icon, Safari mask icon, theme colour and share
      // image. PlatformBrandingGate keeps them in step afterwards (an
      // operator's own favicon / PWA icon from Super Admin → Branding still
      // wins there, as before).
      function applyWebyarKit() {
        var splash = document.getElementById('boot-splash');
        if (!splash || splash.querySelector('.wy-kit-loader')) return;
        splash.setAttribute('aria-label', '\u0648\u0628\u200c\u06cc\u0627\u0631');
        var loader = splash.querySelector('.wy-loader');
        if (loader) {
          loader.outerHTML = '<svg class="wy-kit-loader" viewBox="0 0 100 100" aria-hidden="true">' +
            '<path class="wy-kit-body" d="M79.71 44.57A30 30 0 0 0 29.93 18.1A30 30 0 0 0 51.05 70.37A18.75 18.75 0 0 0 32.97 88.57A1.05 1.05 0 0 1 32 89.58A52.5 52.5 0 0 0 79.71 44.57Z"/>' +
            '<path class="wy-kit-dot wy-kit-d1" d="M62.6 35.29L67.7 40.39L62.6 45.49L57.5 40.39Z"/>' +
            '<path class="wy-kit-dot wy-kit-d2" d="M50 35.29L55.1 40.39L50 45.49L44.9 40.39Z"/>' +
            '<path class="wy-kit-dot wy-kit-d3" d="M37.4 35.29L42.5 40.39L37.4 45.49L32.3 40.39Z"/></svg>';
        }
        var foot = splash.querySelector('.wy-footer');
        if (foot) {
          foot.className = 'wy-footer wy-kit-footer';
          foot.innerHTML = '<img class="wy-kit-light" src="/brand/webyar/webyar-logo-fa-color.svg" alt="" />' +
            '<img class="wy-kit-dark" src="/brand/webyar/webyar-logo-fa-on-dark.svg" alt="" />';
        }
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) { icon.type = 'image/svg+xml'; icon.href = '/brand/webyar/favicon.svg'; }
        var touch = document.querySelector('link[rel="apple-touch-icon"]');
        if (touch) touch.href = '/brand/webyar/apple-touch-icon.png';
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute('content', '#0B7D6C');
        var head = document.head;
        if (head && !document.querySelector('link[rel="mask-icon"]')) {
          var mask = document.createElement('link');
          mask.rel = 'mask-icon';
          mask.href = '/brand/webyar/safari-pinned-tab.svg';
          mask.setAttribute('color', '#0B7D6C');
          head.appendChild(mask);
        }
        if (head && !document.querySelector('meta[property="og:image"]')) {
          var og = document.createElement('meta');
          og.setAttribute('property', 'og:image');
          og.setAttribute('content', '/brand/webyar/og-image-1200x630.png');
          head.appendChild(og);
        }
      }
      window.__wyApplySplash = function () {
        try {
          var ls = window.localStorage;
          var edition = ls.getItem('wy-edition');
          if (edition !== 'iran' && edition !== 'international') {
            if (ls.getItem('platform-region-mode') === 'iran') edition = 'iran';
            else if (ls.getItem('wy-site-mode') === 'multi_language') edition = 'international';
          }
          if (edition === 'iran') { applyWebyarKit(); return; }
          if (edition !== 'international') return;
          var splash = document.getElementById('boot-splash');
          if (!splash || splash.querySelector('.wy-loader.wy-intl')) return;
          // The platform's own name (src/lib/brand.ts cache), not WebYar's mark.
          var brand = null;
          try { brand = JSON.parse(ls.getItem('wy-brand') || 'null'); } catch (e2) {}
          var names = (brand && brand.names) || {};
          var name = names.en || Object.keys(names).map(function (k) { return names[k]; })[0] || '';
          if (name) splash.setAttribute('aria-label', name);
          else splash.removeAttribute('aria-label');
          splash.querySelector('.wy-loader').className += ' wy-intl';
          var foot = splash.querySelector('.wy-footer');
          foot.className = 'wy-footer wy-intl-footer';
          foot.innerHTML = '<img class="wy-intl-light" src="/brand/intl/respok-thread-horizontal-color.svg" alt="" />' +
            '<img class="wy-intl-dark" src="/brand/intl/respok-thread-horizontal-reversed.svg" alt="" />';
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) { icon.type = 'image/svg+xml'; icon.href = '/brand/intl/favicon.svg'; }
          var touch = document.querySelector('link[rel="apple-touch-icon"]');
          if (touch) touch.href = '/brand/intl/apple-touch-icon.png';
        } catch (e) {}
      };
      window.__wyApplySplash();
    </script>
    <div id="root" style="opacity:0"></div>
    <script type="text/javascript">
      (function () {
        if (window.location.pathname !== '/auth/login') return;
        window.__gs = window.__gs || [];
        var d = document;
        var s = d.createElement('script');
        var apiBase = '%VITE_API_BASE_URL%';
        var loaderBase = '%VITE_WIDGET_LOADER_BASE_URL%';
        var assetBase = '%VITE_WIDGET_ASSET_BASE_URL%';
        var widgetLoaderVersion = '2026-04-18-build-8-shell-handoff';
        // Multi-domain safe: require an explicitly configured loader base.
        // window.location.origin would silently break setups where the panel
        // and widget assets live on different hosts. If the env var is not
        // injected at build time, skip the preview snippet entirely.
        if (!loaderBase || loaderBase.indexOf('%VITE_') === 0) return;
        var loaderClean = loaderBase.replace(/\/+$/, '');
        s.src = loaderClean + '/widget/loader.js?v=' + encodeURIComponent(widgetLoaderVersion);
        s.async = 1;
        var assetClean = (assetBase && assetBase.indexOf('%VITE_') !== 0)
          ? assetBase.replace(/\/+$/, '')
          : loaderClean;
        s.setAttribute('data-asset-base', assetClean);
        if (apiBase && apiBase.indexOf('%VITE_') !== 0) {
          s.setAttribute('data-api-base', apiBase.replace(/\/$/, ''));
        }
        d.getElementsByTagName('head')[0].appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
