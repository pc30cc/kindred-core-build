name: WebyarNative
options:
  bundleIdPrefix: com.webyar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: KB548B4TUJ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  WebyarNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    # Generated, and deliberately NOT inside `Resources` — a plist sitting in
    # a resources build phase is also copied verbatim, which makes two
    # commands produce the same output file and fails the build.
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Webyar
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app talks to one fixed HTTPS origin; no ATS exceptions needed.
        ITSAppUsesNonExemptEncryption: false
        # Persian and Turkish ship in-bundle so the language picker works
        # offline and iOS reports the app as localized for them.
        CFBundleLocalizations:
          - en
          - fa
          - tr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webyar.native
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
