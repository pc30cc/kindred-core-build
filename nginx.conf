server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver — needed so nginx can re-resolve the backend
    # service name at runtime (Coolify/Compose containers come and go).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ─────────────────────────────────────────────────────────────────────
    # Backend API reverse proxy — MUST come before the SPA fallback so that
    # /api/* never returns the React HTML. Without this block, the widget
    # bootstrap (and every other backend call) gets the SPA and breaks.
    #
    # The upstream URL is templated via envsubst at container start
    # (see docker-entrypoint.sh). Default: http://backend:3001
    # ─────────────────────────────────────────────────────────────────────
    location /api/ {
        # Use a variable so nginx re-resolves DNS instead of caching at boot
        set $backend_upstream "${BACKEND_URL}";
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Widget assets — MUST be served as static files. Never fall back to
    # index.html, otherwise the loader receives the SPA HTML instead of
    # widget-manifest.json / runtime JS and customers load a broken widget.
    # ─────────────────────────────────────────────────────────────────────

    # Widget loader — never cache so widget config/domain changes apply immediately
    location = /widget/loader.js {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Widget-Asset "loader" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /widget/loader.js =404;
    }

    # Widget manifest — never cache, must always return JSON (or 404). Never HTML.
    location = /widget/widget-manifest.json {
        root /usr/share/nginx/html;
        default_type application/json;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Widget-Asset "manifest" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /widget/widget-manifest.json =404;
    }

    # All other widget assets (hashed runtime js/css) — immutable long cache.
    # Uses regex prefix so it wins over the SPA fallback `location /`.
    location ^~ /widget/ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Widget-Asset "runtime" always;
        add_header Access-Control-Allow-Origin "*" always;
        # Hard 404 — DO NOT fall back to index.html for /widget/* paths.
        try_files $uri =404;
    }

    # Cache other static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — only for non-widget, non-api paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
