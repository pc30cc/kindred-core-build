server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Widget loader — short cache, always revalidate (CDN-friendly)
    location = /widget/loader.js {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Widget-Asset "loader" always;
        try_files $uri =404;
    }

    # Widget hashed runtime assets — immutable long cache
    # Matches runtime.{8-char-hash}.js and runtime.{8-char-hash}.css
    location ~ ^/widget/runtime\.[a-f0-9]{8}\.(js|css)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Widget-Asset "runtime-hashed" always;
        try_files $uri =404;
    }

    # Widget manifest — never cache (backend reads it, but also serveable)
    location = /widget/widget-manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Unhashed widget runtime fallback (dev/preview only)
    location ~ ^/widget/runtime\.(js|css)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Widget-Asset "runtime-unhashed" always;
        try_files $uri =404;
    }

    # Cache other static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
