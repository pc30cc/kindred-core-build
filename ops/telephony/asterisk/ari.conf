; WEBYAR Telephony — ARI (runtime call control only, never a config store).
;
; Bound to loopback/internal only: ARI is not published by the compose file.
; Credentials come from the environment (expanded by entrypoint.sh).

[general]
enabled = yes
pretty = no
allowed_origins = 

[${ASTERISK_ARI_USER}]
type = user
read_only = no
password = ${ASTERISK_ARI_PASSWORD}
password_format = plain
