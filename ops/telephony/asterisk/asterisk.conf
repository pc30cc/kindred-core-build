; WEBYAR Telephony — base Asterisk runtime configuration.

[directories](!)
astetcdir => /etc/asterisk
astmoddir => ${ASTERISK_MODULES_DIR}
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk

[options]
verbose = 3
debug = 0
documentation_language = en_US
; The control service talks to Asterisk over ARI plus `asterisk -rx`, so the
; control socket must exist inside the container.
