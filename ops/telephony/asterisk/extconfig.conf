; WEBYAR Telephony — realtime configuration mapping.
;
; PJSIP object families are read from the restricted `asterisk` PostgreSQL
; schema through res_config_pgsql. The database login is least-privilege and
; scoped to that schema only (search_path is set on the Asterisk DB role).

[settings]
ps_endpoints => pgsql,webyar,ps_endpoints
ps_auths => pgsql,webyar,ps_auths
ps_aors => pgsql,webyar,ps_aors
ps_registrations => pgsql,webyar,ps_registrations
