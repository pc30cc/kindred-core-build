; WEBYAR Telephony — dialplan.
;
; Minimal by design: every inbound PSTN call is handed straight to the Stasis
; application, and ALL call control (ring, answer, bridge to LiveKit SIP,
; hangup) happens over ARI in the control service.

[general]
static = yes
writeprotect = yes

[globals]

; Inbound context used by every tenant endpoint written to PJSIP Realtime.
[webyar-inbound]
exten => _.,1,NoOp(WEBYAR inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(WEBYAR_SIP_CALLID=${CHANNEL(pjsip,call-id)})
 same => n,Stasis(webyar,inbound)
 same => n,Hangup()

; The leg this service originates towards LiveKit SIP re-enters Stasis with the
; `media` argument so the orchestrator does not treat it as a new inbound call.
[webyar-media]
exten => _.,1,NoOp(WEBYAR media leg ${EXTEN})
 same => n,Stasis(webyar,media)
 same => n,Hangup()
