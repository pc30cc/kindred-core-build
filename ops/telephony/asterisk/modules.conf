; WEBYAR Telephony — module loading.
;
; Loads exactly what the MVP needs: PJSIP (SIP stack + outbound registration),
; PostgreSQL realtime, ARI/Stasis, and the codecs DaftareShoma and LiveKit SIP
; negotiate (alaw/ulaw/opus, plus g722 for good measure).

[modules]
autoload = yes

; --- Never load: channel drivers and features the MVP does not use ---------
noload = chan_sip.so
noload = chan_skinny.so
noload = chan_mgcp.so
noload = pbx_dundi.so
noload = res_hep.so

; --- Realtime configuration backend ----------------------------------------
preload = res_config_pgsql.so
preload = res_sorcery_realtime.so
preload = res_sorcery_config.so
preload = res_sorcery_memory.so

; --- SIP stack --------------------------------------------------------------
load = res_pjproject.so
load = res_pjsip.so
load = res_pjsip_session.so
load = res_pjsip_outbound_registration.so
load = res_pjsip_outbound_authenticator_digest.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_registrar.so
load = res_pjsip_nat.so
load = res_pjsip_rfc3326.so
load = res_pjsip_sdp_rtp.so
load = res_pjsip_dtmf_info.so
load = chan_pjsip.so

; --- ARI / Stasis (runtime call control only) -------------------------------
load = res_http_websocket.so
load = res_ari.so
load = res_ari_applications.so
load = res_ari_asterisk.so
load = res_ari_bridges.so
load = res_ari_channels.so
load = res_ari_endpoints.so
load = res_ari_events.so
load = res_ari_playbacks.so
load = res_ari_recordings.so
load = res_stasis.so
load = app_stasis.so

; --- Codecs / media ---------------------------------------------------------
load = codec_alaw.so
load = codec_ulaw.so
load = codec_g722.so
load = codec_opus.so
load = res_format_attr_opus.so
load = res_rtp_asterisk.so
