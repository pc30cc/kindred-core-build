; WEBYAR Telephony — static PJSIP configuration (template).
;
; Per-tenant endpoints/auths/AORs/registrations are NOT here: they live in the
; restricted `asterisk` PostgreSQL schema and are read through PJSIP Realtime
; (see extconfig.conf + sorcery.conf). This file only carries the transports
; and the single static endpoint used to hand calls to LiveKit SIP.
;
; ${...} placeholders are expanded by entrypoint.sh (envsubst) at container
; start. No production host and no credential is hardcoded.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${TELEPHONY_PUBLIC_SIP_HOST}
external_signaling_address = ${TELEPHONY_PUBLIC_SIP_HOST}

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
external_media_address = ${TELEPHONY_PUBLIC_SIP_HOST}
external_signaling_address = ${TELEPHONY_PUBLIC_SIP_HOST}

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
external_media_address = ${TELEPHONY_PUBLIC_SIP_HOST}
external_signaling_address = ${TELEPHONY_PUBLIC_SIP_HOST}

; ── LiveKit SIP media bridge (REQUIRED, no fallback) ─────────────────────────
; Asterisk dials PJSIP/<room-name>@livekit_sip. The long-lived LiveKit SIP
; callee dispatch rule maps that callee to exactly that room.
[livekit_sip]
type = endpoint
transport = transport-udp
context = webyar-media
disallow = all
allow = opus,alaw,ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
aors = livekit_sip
; LiveKit refuses to create an inbound trunk that accepts calls from anywhere,
; so the trunk carries a digest credential and challenges this INVITE. Without
; outbound_auth the call is rejected with 401 before any media is negotiated.
outbound_auth = livekit_sip_auth

[livekit_sip_auth]
type = auth
auth_type = userpass
username = ${LIVEKIT_SIP_AUTH_USERNAME}
password = ${LIVEKIT_SIP_AUTH_PASSWORD}

[livekit_sip]
type = aor
contact = sip:${LIVEKIT_SIP_URI}
qualify_frequency = 30

[livekit_sip]
type = identify
endpoint = livekit_sip
match = ${LIVEKIT_SIP_HOST}
