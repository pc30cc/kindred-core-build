; WEBYAR Telephony — PostgreSQL realtime driver (template).
;
; Credentials come from the environment and are expanded by entrypoint.sh.
; NOTHING is hardcoded here, and the role used must be the least-privilege
; login scoped to the `asterisk` schema (never the application role).

; The section MUST be [general]. res_config_pgsql reads its connection
; settings from [general] and nowhere else: under any other name every value
; silently falls back to a built-in default (user/dbname "asterisk", localhost
; over /tmp/.s.PGSQL.5432), realtime never connects, and PJSIP comes up with
; zero endpoints and zero registrations. The `webyar` in extconfig.conf is the
; driver's database argument, which this driver ignores — it is NOT this
; section name.
[general]
dbhost = ${ASTERISK_DB_HOST}
dbport = ${ASTERISK_DB_PORT}
dbname = ${ASTERISK_DB_NAME}
dbuser = ${ASTERISK_DB_USER}
dbpass = ${ASTERISK_DB_PASSWORD}
dbappname = webyar-telephony
requirements = warn
