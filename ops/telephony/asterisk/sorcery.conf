; WEBYAR Telephony — sorcery wiring for PJSIP Realtime.
;
; Endpoints, auths and AORs are fetched from PostgreSQL on demand, so adding or
; changing one workspace never requires an Asterisk restart. Outbound
; registrations are also realtime; they are re-read with a single
; `module reload res_pjsip_outbound_registration.so` scoped kick performed by
; the control service for the affected object only.

; Each object type lists the `config` wizard FIRST and realtime second.
; Naming a wizard here REPLACES the default one, so with realtime alone the
; static objects in pjsip.conf stop existing entirely — including the
; `livekit_sip` endpoint/AOR that is the only media path out of Asterisk and
; the `livekit_sip_auth` the trunk challenges with. Sorcery consults wizards
; in order, so static objects resolve from pjsip.conf and everything else
; falls through to the per-tenant realtime rows.
[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = realtime,ps_endpoints
auth = config,pjsip.conf,criteria=type=auth
auth = realtime,ps_auths
aor = config,pjsip.conf,criteria=type=aor
aor = realtime,ps_aors

[res_pjsip_outbound_registration]
registration = realtime,ps_registrations
