# WEBYAR Telephony — Asterisk/PJSIP registration adapter, control service and
# the self-hosted LiveKit SIP media bridge.
#
# LiveKit SIP is REQUIRED: it is the only media path (docs/TELEPHONY_ARCHITECTURE.md).
# `livekit` and its Redis must already exist on the same internal network.
#
# Nothing here hardcodes a production domain — every host comes from env.

services:
  webyar-telephony:
    build:
      context: .
      dockerfile: Dockerfile
    image: webyar-telephony:latest
    container_name: webyar-telephony
    restart: unless-stopped
    depends_on:
      - livekit-sip
    environment:
      # Core <-> control service (same secret on both sides, distinct from every
      # other WEBYAR secret — Core validates this at boot).
      TELEPHONY_INTERNAL_SECRET: ${TELEPHONY_INTERNAL_SECRET:?required}
      TELEPHONY_CORE_BASE_URL: ${TELEPHONY_CORE_BASE_URL:?required}
      TELEPHONY_SERVICE_PORT: "8089"
      # Public SIP identity (NAT: must be the externally reachable address).
      TELEPHONY_PUBLIC_SIP_HOST: ${TELEPHONY_PUBLIC_SIP_HOST:?required}
      TELEPHONY_RTP_PORT_MIN: ${TELEPHONY_RTP_PORT_MIN:-16384}
      TELEPHONY_RTP_PORT_MAX: ${TELEPHONY_RTP_PORT_MAX:-16584}
      # Asterisk runtime control (ARI) — internal only, never published.
      ASTERISK_ARI_URL: ${ASTERISK_ARI_URL:-http://127.0.0.1:8088/ari}
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:?required}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?required}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-webyar}
      # PJSIP Realtime provisioning: least-privilege login scoped to the
      # `asterisk` schema only (never the application role).
      ASTERISK_DB_URL: ${ASTERISK_DB_URL:?required}
      ASTERISK_DB_SCHEMA: ${ASTERISK_DB_SCHEMA:-asterisk}
      # Media bridge.
      LIVEKIT_SIP_URI: ${LIVEKIT_SIP_URI:-livekit-sip:5080}
      # LiveKit will not create an inbound trunk that accepts calls from
      # anywhere, so the trunk is protected with a digest credential that
      # Asterisk answers through the livekit_sip endpoint's outbound_auth.
      LIVEKIT_SIP_AUTH_USERNAME: ${LIVEKIT_SIP_AUTH_USERNAME:-webyar-telephony}
      LIVEKIT_SIP_AUTH_PASSWORD: ${LIVEKIT_SIP_AUTH_PASSWORD:?required}
      LIVEKIT_SIP_ALLOWED_ADDRESSES: ${LIVEKIT_SIP_ALLOWED_ADDRESSES:-}
      LIVEKIT_URL: ${LIVEKIT_URL:?required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?required}
      LIVEKIT_SIP_TRUNK_NAME: ${LIVEKIT_SIP_TRUNK_NAME:-webyar-inbound-trunk}
      LIVEKIT_SIP_DISPATCH_NAME: ${LIVEKIT_SIP_DISPATCH_NAME:-webyar-callee-dispatch}
    ports:
      # SIP signalling — restrict the source range to the provider where possible.
      - "${TELEPHONY_SIP_PORT:-5060}:5060/udp"
      - "${TELEPHONY_SIP_PORT:-5060}:5060/tcp"
      - "${TELEPHONY_SIP_TLS_PORT:-5061}:5061/tcp"
      # RTP media.
      - "${TELEPHONY_RTP_PORT_MIN:-16384}-${TELEPHONY_RTP_PORT_MAX:-16584}:16384-16584/udp"
      # ARI (8088) and the control API (8089) are deliberately NOT published.
    expose:
      - "8088"
      - "8089"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -fsS -H \"x-telephony-internal-secret: $$TELEPHONY_INTERNAL_SECRET\" http://127.0.0.1:8089/internal/telephony/health"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - webyar

  # ── Self-hosted LiveKit SIP (REQUIRED) ────────────────────────────────────
  # Bridges the Asterisk SIP leg into the existing LiveKit room the operator
  # browser joins. Uses the existing LiveKit server, Redis, API key and secret.
  livekit-sip:
    image: livekit/sip:latest
    container_name: webyar-livekit-sip
    restart: unless-stopped
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?required}
        api_secret: ${LIVEKIT_API_SECRET:?required}
        ws_url: ${LIVEKIT_URL:?required}
        redis:
          address: ${LIVEKIT_REDIS_ADDRESS:-redis:6379}
        sip_port: 5080
        rtp_port: 20000-20100
        health_port: 8080
        logging:
          level: info
          json: true
    expose:
      - "5080"
      - "5080/udp"
      - "8080"
    # NOT published to the host. Asterisk and LiveKit SIP share this Docker
    # network, so their RTP never leaves it — publishing 20000-20100/udp would
    # expose 101 UDP ports for nothing, and it makes redeploys fail with
    # "port is already allocated" while the previous container still holds the
    # range. Publish it only when LiveKit SIP runs on a DIFFERENT host than
    # Asterisk, by adding a compose override:
    #   ports:
    #     - "${LIVEKIT_SIP_RTP_MIN:-20000}-${LIVEKIT_SIP_RTP_MAX:-20100}:20000-20100/udp"
    healthcheck:
      # The livekit/sip image ships bash but no wget, curl or nc, so the old
      # `wget` probe could only ever fail with "wget: not found" and left the
      # container permanently unhealthy even while SIP was serving fine.
      # bash's /dev/tcp needs no extra tooling and still asserts a real 200.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET / HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$$line" == *200* ]]'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - webyar

  # ── One-shot idempotent bootstrap of the long-lived trunk + dispatch rule ──
  # Safe to run repeatedly: it reuses existing objects instead of creating new
  # ones, and it never creates anything per call.
  webyar-telephony-bootstrap:
    image: webyar-telephony:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webyar-telephony-bootstrap
    restart: "no"
    depends_on:
      - livekit-sip
    entrypoint: ["node", "/opt/webyar/app/dist/bootstrapCli.js"]
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?required}
      LIVEKIT_SIP_TRUNK_NAME: ${LIVEKIT_SIP_TRUNK_NAME:-webyar-inbound-trunk}
      LIVEKIT_SIP_DISPATCH_NAME: ${LIVEKIT_SIP_DISPATCH_NAME:-webyar-callee-dispatch}
      LIVEKIT_SIP_AUTH_USERNAME: ${LIVEKIT_SIP_AUTH_USERNAME:-webyar-telephony}
      LIVEKIT_SIP_AUTH_PASSWORD: ${LIVEKIT_SIP_AUTH_PASSWORD:?required}
      LIVEKIT_SIP_ALLOWED_ADDRESSES: ${LIVEKIT_SIP_ALLOWED_ADDRESSES:-}
    networks:
      - webyar

networks:
  webyar:
    external: true
    name: ${WEBYAR_NETWORK:-webyar}
