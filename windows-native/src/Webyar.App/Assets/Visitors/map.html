<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Leaflet is bundled (Assets/Vendor, the version package-lock.json pins); only the tiles come from the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'" />
<link rel="stylesheet" href="../Vendor/leaflet/leaflet.css" />
<script src="../Vendor/leaflet/leaflet.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; background: transparent; }
  body.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .dot.online { background: #30a46c; box-shadow: 0 0 0 6px rgba(48,164,108,.22), 0 1px 4px rgba(0,0,0,.35); }
  .dot.idle { background: #f5a524; }
  .dot.offline, .dot.unknown { background: #98a2b3; }
  .dot.selected { transform: scale(1.35); border-color: #3b7af2; }
  .leaflet-container { font: 12px/1.4 "Segoe UI Variable Text", "Segoe UI", Vazirmatn, sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<script src="map.js"></script>
</body>
</html>
