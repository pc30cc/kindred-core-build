appId: com.webyar.desktop
productName: Webyar
copyright: Copyright © Webyar
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Webyar-Setup-${version}.${ext}
  # TODO(security): builds are NOT code-signed yet. .github/workflows/desktop-release.yml
  # has no certificate secret, so there is no publisherName here and
  # electron-updater cannot verify the Authenticode signature of downloaded
  # installers (it only checks the sha512 from latest.yml, which comes from the
  # same feed). Until then the app only accepts update feeds on its built-in
  # allow-list (src/main/updater.ts, TRUSTED_FEEDS). Once a certificate exists:
  #   1. add CSC_LINK / CSC_KEY_PASSWORD (or Azure Trusted Signing) secrets to
  #      the release workflow's Publish step, and
  #   2. set `publisherName: [<exact certificate subject CN>]` here, which makes
  #      electron-updater refuse any installer not signed by that publisher
  #      (verifyUpdateCodeSignature stays at its default, which uses it).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Webyar
  runAfterFinish: true
  installerLanguages: [en_US, tr_TR]
  multiLanguageInstaller: true
  deleteAppDataOnUninstall: false
# Auto-update feed. The app reads latest.yml from the newest release of this
# public, binaries-only repo; the source stays private. Releases are made by
# .github/workflows/desktop-release.yml.
publish:
  provider: github
  owner: pc30cc
  repo: webyar-desktop-releases
  releaseType: release
